
name: Deploy to ECS

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  ecr-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Git 소스 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 3. ECR 로그인
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. ARM64 빌드 지원
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # 5. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. Docker 이미지 빌드 및 ECR Push
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./snsg
          file: ./snsg/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/snsg/be:${{ github.ref_name }}
          provenance: false
     # 7. 최신 ECS Task Definition에 새 이미지 적용
      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: snsg-be-web-task
          container-name: snsg-be-web
          image: ${{ steps.login-ecr.outputs.registry }}/snsg/be:${{ github.ref_name }}

      # 8. 새 Revision 등록 및 ECS Service 업데이트
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: snsg-be-cluster
          service: snsg-be-service
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
