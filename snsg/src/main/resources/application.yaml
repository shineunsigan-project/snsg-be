# 프록시(nginx·ALB·ngrok) 뒤에 있을 때 X-Forwarded-* 를 신뢰해 외부 주소를 인식한다.
# 없으면 리다이렉트 주소와 CORS 판정이 내부 주소(localhost:8080) 기준이 되어 틀어진다.
server:
  forward-headers-strategy: framework

spring:
  application:
    name: snsg

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    admin-key: ${KAKAO_ADMIN_KEY}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}

app:
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}

file-storage:
  directory: ${FILE_STORAGE_DIRECTORY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

terms:
  privacy-policy-version: 2026-10-01
  service-terms-version: 2026-10-01

nickname:
  protect-after-change: 14d
  protect-after-withdrawal: 90d

withdrawal:
  anonymize-page-size: 100
  # 탈퇴 회원 비식별 배치 실행 시각. @Scheduled가 자리표시자로 읽어 WithdrawalProperties에는 두지 않는다.
  anonymize-cron: "0 0 4 * * *"

jwt:
  secret: ${JWT_SECRET}

auth:
  access-token-validity: 30m
  refresh-token-validity: 14d
  signup-session-ttl: 15m

place:
  close-max-ratio: 0.3

schedule:
  capacity-min: 4
  capacity-max: 24
  min-lead-time: 1h
  max-advance-days: 30
  overlap-window: 12h
  completion-after: 12h
  page-size-default: 20
  page-size-max: 50
  # 상태 전환 스케줄러 주기. @Scheduled가 자리표시자로 읽어 ScheduleProperties에는 두지 않는다.
  status-transition-interval: 1m

scheduling:
  enabled: true
