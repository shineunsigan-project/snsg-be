# 프록시(nginx·ALB·ngrok) 뒤에 있을 때 X-Forwarded-* 를 신뢰해 외부 주소를 인식한다.
# 없으면 리다이렉트 주소와 CORS 판정이 내부 주소(localhost:8080) 기준이 되어 틀어진다.
server:
  forward-headers-strategy: framework

spring:
  application:
    name: snsg

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    # 빈 기본값을 지우지 않는다. 없으면 자리표시자가 글자 그대로 바인딩되어 그 문자열로 웹훅이 통과할 수 있다. 비어 있으면 웹훅을 모두 거부한다.
    admin-key: ${KAKAO_ADMIN_KEY:}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}

app:
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI}

file-storage:
  # local 모드(디스크 저장)만 쓴다.
  directory: ${FILE_STORAGE_DIRECTORY}
  # 프로필 사진 저장소. s3는 S3에 두고 /images/profiles/** 요청을 CloudFront로 리다이렉트한다.
  # local(application-local.yaml)은 디스크에 두고 같은 경로로 내려준다.
  # @ConditionalOnProperty가 읽는 값이라 설정 record에 두지 않는다.
  type: s3
  # 버킷과 CloudFront 주소의 빈 기본값을 지우지 않는다. 없으면 자리표시자가 글자 그대로 바인딩된다.
  # s3 모드에서 비어 있으면 기동이 실패한다(S3StorageConfig).
  s3:
    bucket: ${FILE_STORAGE_S3_BUCKET:}
    region: ap-northeast-2
    # 같은 리전·5MB 이하라 정상 호출은 1초 안에 끝난다. 호출 전체는 SDK 기본 재시도를 포함한 상한이다.
    connect-timeout: 2s
    socket-timeout: 5s
    api-call-timeout: 10s
  cloudfront:
    url: ${FILE_STORAGE_CLOUDFRONT_URL:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 어드민 경로(/api/admin/**)만 허용하는 출처. 사용자 앱 출처와 섞지 않는다. 비어 있으면 브라우저 호출을 모두 거부한다.
  admin-allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:}

terms:
  privacy-policy-version: 2026-10-01
  service-terms-version: 2026-10-01

nickname:
  protect-after-change: 14d
  protect-after-withdrawal: 90d

withdrawal:
  anonymize-page-size: 100
  # 탈퇴 회원 비식별 배치 실행 시각. @Scheduled가 자리표시자로 읽어 WithdrawalProperties에는 두지 않는다.
  anonymize-cron: "0 0 4 * * *"

jwt:
  secret: ${JWT_SECRET}

auth:
  access-token-validity: 30m
  refresh-token-validity: 14d
  signup-session-ttl: 15m

# 어드민 토큰 서명 키. JWT_SECRET과 다른 값이어야 한다.
admin-jwt:
  secret: ${ADMIN_JWT_SECRET}

admin:
  access-token-validity: 30m
  refresh-token-validity: 12h
  login-max-failures: 5
  login-lock-duration: 15m
  page-size-default: 20
  page-size-max: 50

place:
  close-max-ratio: 0.3
  # 상가정보 적재 배치 실행 시각(3·6·9·12월 1일 03:00). 분기가 끝나고 두 달 뒤에 받아, 분기 데이터 공개가 늦어져도
  # 최신 분기를 받도록 여유를 둔다. 04:00은 탈퇴 회원 비식별(withdrawal.anonymize-cron)이 쓴다.
  # @Scheduled가 자리표시자로 읽어 PlaceProperties에는 두지 않는다.
  import-cron: "0 0 3 1 3,6,9,12 *"
  import-timeout: 10s
  import-max-attempts: 3
  semas-category-codes: [R10405, R10499]
  name-keywords: [보드게임, 보드카페, 방탈출]
  type-keywords:
    BOARD_GAME_CAFE: [보드]
    ESCAPE_ROOM: [방탈출, 이스케이프, escape]
  page-size-default: 20
  page-size-max: 50

public-data:
  api-key: ${DATA_GO_KR_API_KEY}

schedule:
  capacity-min: 4
  capacity-max: 24
  min-lead-time: 1h
  max-advance-days: 30
  overlap-window: 12h
  completion-after: 12h
  page-size-default: 20
  page-size-max: 50
  withdrawal-block-after-start: 24h
  # 상태 전환 스케줄러 주기. @Scheduled가 자리표시자로 읽어 ScheduleProperties에는 두지 않는다.
  status-transition-interval: 1m

scheduling:
  enabled: true

# 서버가 내주는 문서에 어드민 경로가 나오지 않게 한다. 그룹 없는 스펙(/v3/api-docs, /v3/api-docs.yaml)을 거른다.
springdoc:
  paths-to-exclude: /api/admin/**

# 어드민 스펙 그룹. 어느 프로파일에서도 켜지 않는다. docs/openapi-admin.yaml을 만드는 OpenApiSpecTest만 켠다.
# @ConditionalOnProperty가 읽는 값이라 설정 record에 두지 않는다.
openapi:
  admin-group-enabled: false
