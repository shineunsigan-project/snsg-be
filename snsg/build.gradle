plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shineunsigan'
version = '0.0.1-SNAPSHOT'
description = 'snsg'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // 스펙 파일이 바뀌면 테스트를 다시 돌린다. 선언하지 않으면 코드가 그대로일 때 건너뛰어,
    // 스펙만 손댄 변경을 잡지 못한다.
    inputs.files(file('../docs/openapi.yaml')).withPropertyName('openapiSpec')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(file('../docs/openapi-admin.yaml')).withPropertyName('openapiAdminSpec')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('openapiUpdate', System.getenv('OPENAPI_UPDATE') ?: '')
    environment 'OPENAPI_UPDATE', System.getenv('OPENAPI_UPDATE') ?: ''

    // Spring은 테스트 컨텍스트를 구성별로 캐시해 JVM이 끝날 때까지 닫지 않고, 컨텍스트마다 Hikari 풀을 하나씩 잡는다.
    // 기본 풀(10개, 최소 유휴도 10개)이면 DB 슬라이스 구성이 열 개를 넘을 때 PostgreSQL max_connections(100)를 넘어
    // "too many clients already"로 컨텍스트가 뜨지 않는다. 테스트에서는 동시에 쓰는 연결이 많아야 둘
    // (ScheduleCommandServiceTest의 동시 개설)이므로 풀을 작게 둔다.
    systemProperty 'spring.datasource.hikari.maximum-pool-size', '3'
}
