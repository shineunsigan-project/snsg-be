  /api/admin/v1/admins:
    get:
      tags:
      - 어드민
      summary: 어드민 목록 (MASTER 전용)
      description: |-
        가입 승인 관리 화면에서 부른다. 삭제되지 않은 모든 어드민(MASTER와 나 자신 포함)을 준다. status로 한 상태만 고를 수 있다.
        정렬은 가입 신청 일시가 빠른 순(같으면 id 순)이다. 한 번에 size개(기본 20, 최대 50)를 주고, 더 있으면 nextCursor를 준다.
        다음 페이지는 같은 status에 cursor = nextCursor를 붙여 부른다. status를 바꾸면 cursor 없이 처음부터 부른다.
        맞는 어드민이 없으면 items는 빈 배열이고 nextCursor는 null이다.
        승인·거절·이용 중지·해제 뒤(성공이든 실패든) 이 목록을 다시 불러 그린다. 조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: list
      parameters:
      - name: status
        in: query
        description: |-
          이 상태의 어드민만 준다. PENDING(승인 대기), APPROVED(승인됨), REJECTED(거절됨), SUSPENDED(이용 중지).
          생략하면 모든 상태다. 그 밖의 값은 400 INVALID_REQUEST
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
        example: PENDING
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor를 그대로 보낸다. 생략하면 첫 페이지다. 해석할 수 없으면 400 INVALID_CURSOR
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 개수. 생략하면 20, 50보다 크면 50, 1보다 작으면 1로 맞춘다"
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 어드민 한 페이지. nextCursor가 null이면 마지막 페이지다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
        "400":
          description: |-
            INVALID_REQUEST: status가 PENDING·APPROVED·REJECTED·SUSPENDED가 아니거나 size가 숫자가 아니다. 정상 화면 흐름에서는 나지 않는다.
            INVALID_CURSOR: 해석할 수 없는 cursor. cursor 없이 처음부터 다시 부른다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
        "403":
          description: "MASTER_ONLY: MASTER가 아닌 어드민(ADMIN)이 불렀다. MASTER 메뉴는 내 정보의\
            \ role이 MASTER일 때만 그린다. \"MASTER만 할 수 있어요\"를 보여준다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
  /api/admin/v1/admins/me:
    get:
      tags:
      - 어드민
      summary: 내 정보
      description: |-
        로그인한 어드민의 정보를 돌려준다. 로그인·재발급 직후 불러 화면 상단의 이름과 역할별 메뉴(MASTER 전용 메뉴)를 그린다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: getMe
      responses:
        "200":
          description: 내 정보
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminMeResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다. 재발급 후\
            \ 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminMeResponse"
components:
  schemas:
    AdminPlaceUpdateRequest:
      type: object
      properties:
        placeType:
          type: string
          description: "장소 유형. BOARD_GAME_CAFE(보드게임 카페), ESCAPE_ROOM(방탈출), PARK(공원\
            ), UNCLASSIFIED(유형 미정. 승인할 수 없고 거절만 된다)"
          enum:
          - BOARD_GAME_CAFE
          - ESCAPE_ROOM
          - PARK
          - UNCLASSIFIED
          example: ESCAPE_ROOM
        status:
          type: string
          description: "검수 상태. APPROVED(승인, 노출) 또는 REJECTED(거절, 노출하지 않음)만 보낼 수 있다\
            . CANDIDATE를 보내면 400 INVALID_REVIEW_STATUS"
          enum:
          - CANDIDATE
          - APPROVED
          - REJECTED
          example: APPROVED
        name:
          type: string
          description: 화면에 보일 장소명. 앞뒤 공백을 뺀 길이로 1~100자. 저장되는 값은 앞뒤 공백을 뺀 값이다
          example: 키이스케이프 홍대점
          pattern: "^\\s*\\S(?:[\\s\\S]{0,98}\\S)?\\s*$"
        roadAddress:
          type: string
          description: 도로명 주소. 앞뒤 공백을 뺀 길이로 1~200자. 저장되는 값은 앞뒤 공백을 뺀 값이다
          example: 서울특별시 마포구 와우산로 1
          pattern: "^\\s*\\S(?:[\\s\\S]{0,198}\\S)?\\s*$"
        addressDetail:
          type: string
          description: 상세주소(층·호 등). 앞뒤 공백을 뺀 길이로 0~100자. 없으면 빈 문자열을 보낸다(생략·null 불가)
          example: 3층
          pattern: "^\\s*(?:\\S(?:[\\s\\S]{0,98}\\S)?)?\\s*$"
        latitude:
          type: number
          description: 위도. 33~39(경계 포함). 소수 8자리부터는 7자리로 반올림(HALF_UP)해 저장한다
          example: 37.5512345
          maximum: 39
          minimum: 33
        longitude:
          type: number
          description: 경도. 124~132(경계 포함). 소수 8자리부터는 7자리로 반올림(HALF_UP)해 저장한다
          example: 126.9212345
          maximum: 132
          minimum: 124
        regionCode:
          type: string
          description: 화면 지역 코드. 어드민 지역 목록(GET /api/admin/v1/regions)의 code. 비활성 지역도
            된다. 목록에 없는 코드면 400 INVALID_REGION
          example: "11440"
          minLength: 1
      required:
      - addressDetail
      - latitude
      - longitude
      - name
      - placeType
      - regionCode
      - roadAddress
      - status
    AdminPlaceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 장소 id. 상세·수정 경로의 placeId
          example: 01a1a2b3-0000-7000-8000-000000000001
        placeType:
          type: string
          description: "장소 유형. BOARD_GAME_CAFE(보드게임 카페), ESCAPE_ROOM(방탈출), PARK(공원\
            ), UNCLASSIFIED(유형 미정. 적재가 정하지 못한 후보. 승인할 수 없다)"
          enum:
          - BOARD_GAME_CAFE
          - ESCAPE_ROOM
          - PARK
          - UNCLASSIFIED
          example: ESCAPE_ROOM
        status:
          type: string
          description: "검수 상태. CANDIDATE(검수 대기. 적재가 만든 후보), APPROVED(승인. 폐업이 아니고 지\
            역이 활성이면 사용자에게 노출), REJECTED(거절. 노출하지 않고 적재가 다시 후보로 돌리지 않는다)"
          enum:
          - CANDIDATE
          - APPROVED
          - REJECTED
          example: APPROVED
        name:
          type: string
          description: "화면 값: 사용자에게 보이는 장소명"
          example: 키이스케이프 홍대점
        roadAddress:
          type: string
          description: "화면 값: 도로명 주소"
          example: 서울특별시 마포구 와우산로 1
        addressDetail:
          type: string
          description: "화면 값: 상세주소(층·호 등). 없으면 빈 문자열"
          example: 3층
        latitude:
          type: number
          description: "화면 값: 위도(소수 7자리까지)"
          example: 37.5512345
        longitude:
          type: number
          description: "화면 값: 경도(소수 7자리까지)"
          example: 126.9212345
        regionCode:
          type: string
          description: "화면 값: 지역 코드(시군구 5자리). 어드민 지역 목록의 code"
          example: "11440"
        isClosed:
          type: boolean
          description: "폐업 여부. 적재가 원천에서 찾지 못하면 true, 다시 찾으면 false로 바꾼다. 어드민은 바꿀 수\
            \ 없다. true면 승인이어도 노출되지 않는다"
          example: false
        source:
          type: string
          description: "원천. SEMAS(소상공인 상가정보), PARK_STANDARD(공원 표준데이터), MANUAL(어드민이\
            \ 직접 등록)"
          enum:
          - SEMAS
          - PARK_STANDARD
          - MANUAL
          example: SEMAS
        sourceId:
          type: string
          description: 원천의 식별자(상가정보면 상가업소번호). MANUAL이면 빈 문자열
          example: MA010120220800001234
        sourceName:
          type: string
          description: "원천 값: 마지막 적재에서 받은 이름. 적재만 바꾼다. MANUAL이면 빈 문자열"
          example: 키이스케이프 홍대점
        sourceRoadAddress:
          type: string
          description: "원천 값: 마지막 적재에서 받은 도로명 주소. MANUAL이면 빈 문자열"
          example: 서울특별시 마포구 와우산로 1
        sourceAddressDetail:
          type: string
          description: "원천 값: 마지막 적재에서 받은 상세주소(층). 없거나 MANUAL이면 빈 문자열"
          example: 3층
        sourceLatitude:
          type: number
          description: "원천 값: 마지막 적재에서 받은 위도. MANUAL이면 0"
          example: 37.5512345
        sourceLongitude:
          type: number
          description: "원천 값: 마지막 적재에서 받은 경도. MANUAL이면 0"
          example: 126.9212345
        sourceRegionCode:
          type: string
          description: "원천 값: 마지막 적재에서 확인한 지역 코드. MANUAL이면 빈 문자열"
          example: "11440"
        lastSyncedAt:
          type: string
          format: date-time
          description: "원천에서 마지막으로 확인한 일시. 한국 시간, 오프셋 없는 ISO-8601. MANUAL이면 등록 일시"
          example: 2026-12-01T03:12:45
        createdAt:
          type: string
          format: date-time
          description: "행을 만든 일시(적재 또는 등록). 한국 시간, 오프셋 없는 ISO-8601. 목록 정렬 기준"
          example: 2026-11-02T10:15:30
        createdBy:
          type: string
          description: "행을 만든 주체. 어드민 id(MANUAL 등록), SYSTEM_SCHEDULER(적재), SYSTEM(마\
            이그레이션 등 그 밖)"
          example: SYSTEM_SCHEDULER
        updatedAt:
          type: string
          format: date-time
          description: "마지막으로 바뀐 일시. 한국 시간, 오프셋 없는 ISO-8601. 적재가 확인할 때마다 바뀐다"
          example: 2026-12-01T03:12:45
        updatedBy:
          type: string
          description: "마지막으로 바꾼 주체. 어드민 id, SYSTEM_SCHEDULER(적재), SYSTEM(그 밖). 적재\
            가 확인할 때마다 SYSTEM_SCHEDULER로 덮으므로 검수한 사람은 reviewedBy로 본다"
          example: SYSTEM_SCHEDULER
        reviewedBy:
          type: string
          description: 마지막으로 수정·등록한 어드민 id. 적재는 바꾸지 않는다. API로 검수한 적 없으면 빈 문자열
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        reviewedAt:
          type: string
          format: date-time
          description: "마지막으로 수정·등록한 일시. 한국 시간, 오프셋 없는 ISO-8601. 적재는 바꾸지 않는다. API로\
            \ 검수한 적 없으면 null"
          example: 2026-11-13T14:20:00
    ApiResponseAdminPlaceResponse:
