openapi: 3.1.0
info:
  title: snsg admin API
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: 어드민
  description: 어드민 계정. 목록·승인·거절·이용 중지·해제는 MASTER 전용이다
- name: 어드민 인증
  description: "어드민 가입 신청, 로그인, 토큰 재발급, 로그아웃"
paths:
  /api/admin/v1/auth/tokens:
    post:
      tags:
      - 어드민 인증
      summary: 어드민 access token 재발급
      description: |-
        adminRefreshToken 쿠키로 새 access token을 발급한다. credentials를 포함해 호출한다.
        어드민 앱에 들어올 때(새로고침 포함) 먼저 부르고, 401을 받은 요청을 다시 보내기 전에 부른다.
        발급하면 같은 기기의 이전 refresh token은 무효가 되므로 동시에 여러 번 호출하지 않는다.
        재발급해도 세션은 늘어나지 않는다. 로그인 후 12시간이 지나면 401이고 다시 로그인해야 한다.
        새 쿠키의 수명은 로그인 후 12시간까지 남은 시간이다. 승인이 풀린 어드민은 재발급되지 않는다.
        401 INVALID_ADMIN_REFRESH_TOKEN이면 로그인 화면으로 보낸다.
      operationId: reissue
      parameters:
      - name: adminRefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 재발급 성공. 새 adminRefreshToken 쿠키가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "401":
          description: "INVALID_ADMIN_REFRESH_TOKEN: 쿠키가 없거나 만료·위조·회전됐거나 로그아웃됐거나,\
            \ 어드민이 승인 상태가 아니다. 로그인 화면으로 보낸다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
      security: []
    delete:
      tags:
      - 어드민 인증
      summary: 어드민 로그아웃
      description: |-
        adminRefreshToken 쿠키가 가리키는 이 기기의 세션만 끝내고 쿠키를 만료시킨다. 다른 기기의 로그인은 유지된다.
        쿠키를 읽으므로 credentials를 포함해 호출한다.
        쿠키가 없거나 이미 끝난 세션이어도 200이다. 다시 호출해도 안전하다.
        이미 발급된 access token은 만료까지 유효하므로 클라이언트에서 버린다.
      operationId: logout
      parameters:
      - name: adminRefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 로그아웃 완료. adminRefreshToken 쿠키를 만료시키는 Set-Cookie가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: access token이 없거나 만료·무효. 토큰을 버리고 로그인 화면으로\
            \ 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/admin/v1/auth/signup:
    post:
      tags:
      - 어드민 인증
      summary: 어드민 가입 신청
      description: |-
        가입 화면에서 제출하면 부른다. 승인 대기 상태로 저장되고 토큰·쿠키는 주지 않는다.
        MASTER가 승인하기 전까지는 로그인하면 403 ADMIN_PENDING_APPROVAL이다.
        필드 형식이 틀리면 400 INVALID_REQUEST와 함께 errors에 틀린 필드와 문구가 담긴다.
        team에 목록 밖의 값을 보내거나 없는 날짜를 보내면 JSON 변환 단계에서 실패해 400 INVALID_REQUEST만 오고 errors는 없다.
        성공한 요청을 다시 보내면 같은 아이디가 이미 있으므로 409 DUPLICATED_LOGIN_ID다. 응답 전까지 버튼을 막는다.
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSignUpRequest"
        required: true
      responses:
        "201":
          description: 가입 신청 완료. data는 없다. 승인 대기 안내 후 로그인 화면으로 보낸다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: 필드 형식 오류. errors의 필드별 문구를 입력칸 아래에 보여준다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: "DUPLICATED_LOGIN_ID: 이미 쓰이는 아이디. 다른 아이디를 입력받는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security: []
  /api/admin/v1/auth/login:
    post:
      tags:
      - 어드민 인증
      summary: 어드민 로그인
      description: |-
        아이디·비밀번호로 로그인한다. access token을 본문으로, refresh token을 adminRefreshToken 쿠키로 준다.
        쿠키를 받아야 하므로 credentials를 포함해 호출한다.
        아이디가 없는 것과 비밀번호가 틀린 것은 구분하지 않고 401 INVALID_ADMIN_CREDENTIALS다.
        같은 아이디로 5회 연속 실패하면 15분 동안 잠기고(401 ADMIN_LOGIN_LOCKED), 잠긴 동안은 비밀번호가 맞아도 같은 코드다.
        비밀번호가 맞았지만 승인 대기면 403 ADMIN_PENDING_APPROVAL, 가입이 거절됐으면 403 ADMIN_REJECTED,
        이용 중지됐으면 403 ADMIN_SUSPENDED다. 비밀번호가 틀리면 상태와 관계없이 401 INVALID_ADMIN_CREDENTIALS다.
        로그인할 때마다 새 기기 세션이 생긴다. 다른 기기의 로그인은 끊기지 않는다.
        세션은 로그인 후 12시간에 끝난다. 재발급해도 늘어나지 않는다.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
        required: true
      responses:
        "200":
          description: 로그인 성공. adminRefreshToken 쿠키가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "400":
          description: "INVALID_REQUEST: 아이디나 비밀번호가 비었거나 64자를 넘는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "401":
          description: |-
            INVALID_ADMIN_CREDENTIALS: 아이디가 없거나 비밀번호가 틀렸다. 아이디 또는 비밀번호가 틀렸다고 안내한다.
            ADMIN_LOGIN_LOCKED: 같은 아이디로 5회 연속 실패해 15분 동안 잠겼다. 잠시 후 다시 시도하라고 안내한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "403":
          description: |-
            ADMIN_PENDING_APPROVAL: 비밀번호는 맞지만 아직 승인되지 않았다. 승인 대기 안내를 보여준다.
            ADMIN_REJECTED: 비밀번호는 맞지만 가입이 거절됐다. message를 보여준다. 이 아이디로는 다시 가입·로그인할 수 없다.
            ADMIN_SUSPENDED: 비밀번호는 맞지만 이용이 중지됐다. message를 보여준다. MASTER가 해제하면 다시 로그인할 수 있다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
      security: []
  /api/admin/v1/admins/{adminId}/suspension:
    post:
      tags:
      - 어드민
      summary: 이용 중지 (MASTER 전용)
      description: |-
        승인된(APPROVED) 어드민의 이용을 중지한다. 목록의 [이용 중지]에서 부른다. 요청 본문은 없다.
        성공하면 200이고 data는 없다. 성공이든 실패든 목록을 다시 불러 그린다.
        중지된 어드민은 다음 요청부터 401 UNAUTHENTICATED이고, 그 어드민의 로그인 세션을 모두 지워 재발급도 되지 않는다.
        중지된 사람이 로그인하면 비밀번호가 맞을 때만 403 ADMIN_SUSPENDED를 받는다. 해제(같은 경로의 DELETE)해도 다시 로그인해야 한다.
        500이 나면 중지는 반영됐을 수 있다. 목록을 다시 불러 상태를 확인한다.
        두 번 눌려 같은 요청이 두 번 와도 중지는 한 번이다. 두 번째 요청은 409 ADMIN_STATUS_CONFLICT이니 응답이 올 때까지 버튼을 막는다.
        여러 조건에 걸리면 ADMIN_NOT_FOUND → MASTER_NOT_MODIFIABLE → ADMIN_STATUS_CONFLICT 순서로 앞의 것이 온다.
      operationId: suspend
      parameters:
      - name: adminId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 이용 중지 완료. data는 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: adminId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: |-
            MASTER_ONLY: MASTER가 아닌 어드민(ADMIN)이 불렀다. MASTER 메뉴는 내 정보의 role이 MASTER일 때만 그린다. "MASTER만 할 수 있어요"를 보여준다
            MASTER_NOT_MODIFIABLE: 대상이 MASTER다(자기 자신 포함). MASTER는 API로 승인·거절·이용 중지·해제할 수 없다. MASTER 행에는 버튼을 그리지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: "ADMIN_NOT_FOUND: 없거나 삭제된 어드민. 목록을 다시 불러 그린다. 없는 경로의 404(INVALID_REQUEST)와\
            는 code로 구분한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: "ADMIN_STATUS_CONFLICT: 대상의 지금 상태에서 할 수 없는 동작이다(이미 처리됨, 다른\
            \ MASTER가 먼저 처리함 포함). 아무것도 바뀌지 않았다. 목록을 다시 불러 그린다. 이용 중지는 APPROVED일 때만\
            \ 된다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
    delete:
      tags:
      - 어드민
      summary: 이용 중지 해제 (MASTER 전용)
      description: |-
        이용 중지(SUSPENDED)된 어드민을 다시 승인 상태(APPROVED)로 돌린다. 목록의 [이용 중지 해제]에서 부른다. 요청 본문은 없다.
        성공하면 200이고 data는 없다. 성공이든 실패든 목록을 다시 불러 그린다.
        중지할 때 세션을 모두 지웠으므로 해제된 어드민은 다시 로그인한다.
        두 번 눌려 같은 요청이 두 번 와도 해제는 한 번이다. 두 번째 요청은 409 ADMIN_STATUS_CONFLICT이니 응답이 올 때까지 버튼을 막는다.
        여러 조건에 걸리면 ADMIN_NOT_FOUND → MASTER_NOT_MODIFIABLE → ADMIN_STATUS_CONFLICT 순서로 앞의 것이 온다.
      operationId: unsuspend
      parameters:
      - name: adminId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 이용 중지 해제 완료. data는 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: adminId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: |-
            MASTER_ONLY: MASTER가 아닌 어드민(ADMIN)이 불렀다. MASTER 메뉴는 내 정보의 role이 MASTER일 때만 그린다. "MASTER만 할 수 있어요"를 보여준다
            MASTER_NOT_MODIFIABLE: 대상이 MASTER다(자기 자신 포함). MASTER는 API로 승인·거절·이용 중지·해제할 수 없다. MASTER 행에는 버튼을 그리지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: "ADMIN_NOT_FOUND: 없거나 삭제된 어드민. 목록을 다시 불러 그린다. 없는 경로의 404(INVALID_REQUEST)와\
            는 code로 구분한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: "ADMIN_STATUS_CONFLICT: 대상의 지금 상태에서 할 수 없는 동작이다(이미 처리됨, 다른\
            \ MASTER가 먼저 처리함 포함). 아무것도 바뀌지 않았다. 목록을 다시 불러 그린다. 해제는 SUSPENDED일 때만 된\
            다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/admin/v1/admins/{adminId}/rejection:
    post:
      tags:
      - 어드민
      summary: 가입 거절 (MASTER 전용)
      description: |-
        승인 대기(PENDING) 어드민의 가입을 거절한다. 목록의 [거절]에서 부른다. 요청 본문은 없다.
        성공하면 200이고 data는 없다. 성공이든 실패든 목록을 다시 불러 그린다.
        거절은 되돌릴 수 없다. 거절된 아이디는 다시 쓸 수 없어, 같은 사람이 다시 신청하려면 다른 아이디로 가입한다.
        거절된 사람이 로그인하면 비밀번호가 맞을 때만 403 ADMIN_REJECTED를 받는다.
        두 번 눌려 같은 요청이 두 번 와도 거절은 한 번이다. 두 번째 요청은 409 ADMIN_STATUS_CONFLICT이니 응답이 올 때까지 버튼을 막는다.
        여러 조건에 걸리면 ADMIN_NOT_FOUND → MASTER_NOT_MODIFIABLE → ADMIN_STATUS_CONFLICT 순서로 앞의 것이 온다.
      operationId: reject
      parameters:
      - name: adminId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 거절 완료. data는 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: adminId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: |-
            MASTER_ONLY: MASTER가 아닌 어드민(ADMIN)이 불렀다. MASTER 메뉴는 내 정보의 role이 MASTER일 때만 그린다. "MASTER만 할 수 있어요"를 보여준다
            MASTER_NOT_MODIFIABLE: 대상이 MASTER다(자기 자신 포함). MASTER는 API로 승인·거절·이용 중지·해제할 수 없다. MASTER 행에는 버튼을 그리지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: "ADMIN_NOT_FOUND: 없거나 삭제된 어드민. 목록을 다시 불러 그린다. 없는 경로의 404(INVALID_REQUEST)와\
            는 code로 구분한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: "ADMIN_STATUS_CONFLICT: 대상의 지금 상태에서 할 수 없는 동작이다(이미 처리됨, 다른\
            \ MASTER가 먼저 처리함 포함). 아무것도 바뀌지 않았다. 목록을 다시 불러 그린다. 거절은 PENDING일 때만 된다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/admin/v1/admins/{adminId}/approval:
    post:
      tags:
      - 어드민
      summary: 가입 승인 (MASTER 전용)
      description: |-
        승인 대기(PENDING) 어드민의 가입을 승인한다. 목록의 [승인]에서 부른다. 요청 본문은 없다.
        성공하면 200이고 data는 없다. 승인된 어드민은 그때부터 로그인할 수 있다. 성공이든 실패든 목록을 다시 불러 그린다.
        두 번 눌려 같은 요청이 두 번 와도 승인은 한 번이다. 두 번째 요청은 409 ADMIN_STATUS_CONFLICT이니 응답이 올 때까지 버튼을 막는다.
        여러 조건에 걸리면 ADMIN_NOT_FOUND → MASTER_NOT_MODIFIABLE → ADMIN_STATUS_CONFLICT 순서로 앞의 것이 온다.
      operationId: approve
      parameters:
      - name: adminId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 승인 완료. data는 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: adminId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "403":
          description: |-
            MASTER_ONLY: MASTER가 아닌 어드민(ADMIN)이 불렀다. MASTER 메뉴는 내 정보의 role이 MASTER일 때만 그린다. "MASTER만 할 수 있어요"를 보여준다
            MASTER_NOT_MODIFIABLE: 대상이 MASTER다(자기 자신 포함). MASTER는 API로 승인·거절·이용 중지·해제할 수 없다. MASTER 행에는 버튼을 그리지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: "ADMIN_NOT_FOUND: 없거나 삭제된 어드민. 목록을 다시 불러 그린다. 없는 경로의 404(INVALID_REQUEST)와\
            는 code로 구분한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: "ADMIN_STATUS_CONFLICT: 대상의 지금 상태에서 할 수 없는 동작이다(이미 처리됨, 다른\
            \ MASTER가 먼저 처리함 포함). 아무것도 바뀌지 않았다. 목록을 다시 불러 그린다. 승인은 PENDING일 때만 된다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/admin/v1/admins:
    get:
      tags:
      - 어드민
      summary: 어드민 목록 (MASTER 전용)
      description: |-
        가입 승인 관리 화면에서 부른다. 삭제되지 않은 모든 어드민(MASTER와 나 자신 포함)을 준다. status로 한 상태만 고를 수 있다.
        정렬은 가입 신청 일시가 빠른 순(같으면 id 순)이다. 한 번에 size개(기본 20, 최대 50)를 주고, 더 있으면 nextCursor를 준다.
        다음 페이지는 같은 status에 cursor = nextCursor를 붙여 부른다. status를 바꾸면 cursor 없이 처음부터 부른다.
        맞는 어드민이 없으면 items는 빈 배열이고 nextCursor는 null이다.
        승인·거절·이용 중지·해제 뒤(성공이든 실패든) 이 목록을 다시 불러 그린다. 조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: list
      parameters:
      - name: status
        in: query
        description: |-
          이 상태의 어드민만 준다. PENDING(승인 대기), APPROVED(승인됨), REJECTED(거절됨), SUSPENDED(이용 중지).
          생략하면 모든 상태다. 그 밖의 값은 400 INVALID_REQUEST
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
        example: PENDING
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor를 그대로 보낸다. 생략하면 첫 페이지다. 해석할 수 없으면 400 INVALID_CURSOR
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 개수. 생략하면 20, 50보다 크면 50, 1보다 작으면 1로 맞춘다"
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 어드민 한 페이지. nextCursor가 null이면 마지막 페이지다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
        "400":
          description: |-
            INVALID_REQUEST: status가 PENDING·APPROVED·REJECTED·SUSPENDED가 아니거나 size가 숫자가 아니다. 정상 화면 흐름에서는 나지 않는다.
            INVALID_CURSOR: 해석할 수 없는 cursor. cursor 없이 처음부터 다시 부른다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
        "403":
          description: "MASTER_ONLY: MASTER가 아닌 어드민(ADMIN)이 불렀다. MASTER 메뉴는 내 정보의\
            \ role이 MASTER일 때만 그린다. \"MASTER만 할 수 있어요\"를 보여준다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminListResponse"
  /api/admin/v1/admins/me:
    get:
      tags:
      - 어드민
      summary: 내 정보
      description: |-
        로그인한 어드민의 정보를 돌려준다. 로그인·재발급 직후 불러 화면 상단의 이름과 역할별 메뉴(MASTER 전용 메뉴)를 그린다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: getMe
      responses:
        "200":
          description: 내 정보
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminMeResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다. 재발급 후\
            \ 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminMeResponse"
components:
  schemas:
    AdminTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "어드민 API의 Authorization 헤더에 Bearer로 넣는다. 30분 뒤 만료되며, 로그인 후\
            \ 12시간(세션 만료)이 30분 안에 오면 그때 만료된다. 메모리에만 보관한다. 사용자 앱의 토큰과 섞지 않는다"
    ApiResponseAdminTokenResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AdminTokenResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    AdminSignUpRequest:
      type: object
      properties:
        loginId:
          type: string
          description: 로그인 아이디. 영문 소문자로 시작하는 4~20자의 영문 소문자·숫자. 대문자는 받지 않는다. 다른 어드민과
            겹칠 수 없다
          example: mintadmin
          pattern: "^[a-z][a-z0-9]{3,19}$"
        password:
          type: string
          description: "비밀번호. 8~64자, 영문과 숫자를 각각 1자 이상. 공백 없는 영문·숫자·특수문자(ASCII)만 쓸\
            \ 수 있고 한글은 받지 않는다"
          example: mint1234!
          pattern: "^(?=.*[A-Za-z])(?=.*[0-9])[\\x21-\\x7E]{8,64}$"
        name:
          type: string
          description: 실명. 2~20자의 한글 또는 영문. 공백·숫자는 받지 않는다
          example: 김민트
          pattern: "^[가-힣a-zA-Z]{2,20}$"
        team:
          type: string
          description: |-
            소속팀. PLANNING(기획), DESIGN(디자인), FRONTEND(개발(FE)), BACKEND(개발(BE)), MARKETING(마케팅),
            OPERATIONS(운영), BUSINESS(사업개발), DATA(데이터), MANAGEMENT(경영지원)
          enum:
          - PLANNING
          - DESIGN
          - FRONTEND
          - BACKEND
          - MARKETING
          - OPERATIONS
          - BUSINESS
          - DATA
          - MANAGEMENT
          example: BACKEND
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd). 오늘(한국 시간)보다 이전이어야 한다
          example: 1996-04-12
      required:
      - birthDate
      - loginId
      - name
      - password
      - team
    ApiResponseVoid:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    AdminLoginRequest:
      type: object
      properties:
        loginId:
          type: string
          description: 로그인 아이디. 입력한 그대로 보낸다. 최대 64자
          example: mintadmin
          maxLength: 64
          minLength: 0
        password:
          type: string
          description: 비밀번호. 최대 64자
          example: mint1234!
          maxLength: 64
          minLength: 0
      required:
      - loginId
      - password
    AdminListResponse:
      type: object
      properties:
        items:
          type: array
          description: 어드민. 가입 신청 일시가 빠른 순(같으면 id 순)이다. 없으면 빈 배열
          items:
            $ref: "#/components/schemas/AdminSummaryResponse"
        nextCursor:
          type: string
          description: |-
            다음 페이지 커서. 다음 페이지를 부를 때 그대로 cursor로 보낸다. 마지막 페이지면 null이다.
            내용을 해석하지 않는 불투명 문자열이다(영문·숫자·_·-만 쓴다)
          example: MjAyNi0xMS0xM1QxMDoxNTozMHwwMTkyZjNhNC01YjZjLTdkOGUtOWYwMS0yMzQ1Njc4OWFiY2Q
    AdminSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 어드민 식별자. 승인·거절·이용 중지·해제 경로의 adminId로 쓴다
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        loginId:
          type: string
          description: 로그인 아이디
          example: mintadmin
        name:
          type: string
          description: 실명
          example: 김민트
        team:
          type: string
          description: 소속팀. 값과 이름은 가입 요청의 team과 같다
          enum:
          - PLANNING
          - DESIGN
          - FRONTEND
          - BACKEND
          - MARKETING
          - OPERATIONS
          - BUSINESS
          - DATA
          - MANAGEMENT
          example: BACKEND
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd)
          example: 1996-04-12
        role:
          type: string
          description: |-
            역할. MASTER는 DB로만 만들고 관리하므로 승인·거절·이용 중지·해제 버튼을 그리지 않는다(부르면 403 MASTER_NOT_MODIFIABLE).
            ADMIN은 가입 신청으로 생긴 일반 어드민이다
          enum:
          - MASTER
          - ADMIN
          example: ADMIN
        status:
          type: string
          description: |-
            상태. PENDING(승인 대기): [승인]·[거절]을 그린다.
            APPROVED(승인됨): [이용 중지]를 그린다.
            REJECTED(거절됨): 버튼 없음. 거절은 되돌릴 수 없고 이 아이디는 다시 쓸 수 없다.
            SUSPENDED(이용 중지): [이용 중지 해제]를 그린다
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
          example: PENDING
        createdAt:
          type: string
          format: date-time
          description: "가입 신청 일시. 한국 시간, 오프셋 없는 ISO-8601"
          example: 2026-11-13T10:15:30
    ApiResponseAdminListResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AdminListResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    AdminMeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 어드민 식별자
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        loginId:
          type: string
          description: 로그인 아이디
          example: mintadmin
        name:
          type: string
          description: 실명
          example: 김민트
        team:
          type: string
          description: 소속팀. 값과 이름은 가입 요청의 team과 같다
          enum:
          - PLANNING
          - DESIGN
          - FRONTEND
          - BACKEND
          - MARKETING
          - OPERATIONS
          - BUSINESS
          - DATA
          - MANAGEMENT
          example: BACKEND
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd)
          example: 1996-04-12
        role:
          type: string
          description: 역할. MASTER는 가입 승인 등 MASTER 전용 메뉴를 볼 수 있다. ADMIN은 일반 어드민이다
          enum:
          - MASTER
          - ADMIN
          example: ADMIN
    ApiResponseAdminMeResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AdminMeResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  securitySchemes:
    bearerAuth:
      type: http
      description: |-
        어드민 로그인·재발급 응답 본문의 accessToken을 넣는다. Bearer는 빼고 토큰 값만 넣는다.
        사용자 앱의 토큰은 받지 않는다. refresh token은 HttpOnly 쿠키라 여기에 넣지 않는다.
      scheme: bearer
      bearerFormat: JWT