          description: 도로명 주소. 앞뒤 공백을 뺀 길이로 1~200자. 저장되는 값은 앞뒤 공백을 뺀 값이다
          example: 서울특별시 서대문구 연세로 1
          pattern: "^\\s*\\S(?:[\\s\\S]{0,198}\\S)?\\s*$"
        addressDetail:
