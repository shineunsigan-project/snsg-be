openapi: 3.1.0
info:
  title: snsg admin API
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: 어드민
  description: 어드민 계정. 목록·승인·거절·이용 중지·해제는 MASTER 전용이다
- name: 어드민 인증
  description: "어드민 가입 신청, 로그인, 토큰 재발급, 로그아웃"
- name: 어드민 장소
  description: 장소 검수·수정·MANUAL 등록. 승인된 어드민(ADMIN·MASTER) 누구나 쓴다
- name: 어드민 지역
  description: 장소 등록·수정과 목록 필터에 쓰는 지역. 승인된 어드민(ADMIN·MASTER) 누구나 쓴다
paths:
  /api/admin/v1/places/{placeId}:
    get:
      tags:
      - 어드민 장소
      summary: 장소 상세
      description: |-
        장소 하나를 준다. 목록 항목과 같은 필드다. 수정 화면을 열 때 지금 값을 다시 받아 채운다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: getPlace
      parameters:
      - name: placeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 장소
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "400":
          description: "INVALID_REQUEST: placeId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "404":
          description: "PLACE_NOT_FOUND: 없는 장소다. 목록을 다시 불러 그린다. 없는 경로의 404(INVALID_REQUEST)와\
            는 code로 구분한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
    put:
      tags:
      - 어드민 장소
      summary: 장소 수정(검수)
      description: |-
        유형·검수 상태·화면 값(이름·도로명 주소·상세주소·좌표·지역)을 모두 보낸 값으로 바꾼다. 부분 수정은 없다.
        수정 화면은 상세의 지금 값으로 채운 뒤 바꾼 칸만 고쳐 전체를 보낸다.
        검수 상태는 APPROVED(승인) 또는 REJECTED(거절)만 보낼 수 있다. 유형 미정(UNCLASSIFIED)은 거절만 된다.
        원천 값(source*), 폐업 여부(isClosed), 마지막 확인 일시(lastSyncedAt), 원천(source)은 바꿀 수 없다. 폐업한 장소도 고칠 수 있다.
        성공하면 200이고 data는 수정된 장소다. reviewedBy가 요청한 어드민 id, reviewedAt이 지금이 된다.
        같은 요청을 다시 보내도 결과는 같다(reviewedAt만 바뀐다). 다른 어드민과 동시에 고치면 나중에 처리된 요청이 남는다.
        여러 조건에 걸리면 PLACE_NOT_FOUND → INVALID_REGION → INVALID_REVIEW_STATUS → UNCLASSIFIED_NOT_APPROVABLE 순서로 앞의 것이 온다.
      operationId: updatePlace
      parameters:
      - name: placeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPlaceUpdateRequest"
        required: true
      responses:
        "200":
          description: 수정된 장소
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "400":
          description: |-
            INVALID_REQUEST(errors 있음): 필드 형식 오류. errors[].message를 그 입력칸 아래에 보여준다.
            INVALID_REQUEST(errors 없음): 본문 없음·잘못된 JSON·목록 밖 enum 값·숫자가 아닌 좌표. 정상 화면 흐름에서는 나지 않는다. message를 보여준다.
            INVALID_REGION: regionCode가 지역 목록에 없다. 지역을 다시 고르게 한다.
            UNCLASSIFIED_NOT_APPROVABLE: 유형 미정(UNCLASSIFIED)으로 승인하려 했다. 유형을 고르게 한다
            INVALID_REVIEW_STATUS: status가 CANDIDATE다. 승인·거절 중에서 고르게 한다.
            INVALID_REQUEST(errors 없음): placeId가 UUID 형식이 아니다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "404":
          description: "PLACE_NOT_FOUND: 없는 장소다. 목록을 다시 불러 그린다. 없는 경로의 404(INVALID_REQUEST)와\
            는 code로 구분한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
  /api/admin/v1/places:
    get:
      tags:
      - 어드민 장소
      summary: 장소 목록
      description: |-
        장소 검수 화면에서 부른다. 노출 여부와 상관없이 모든 장소(검수 대기·승인·거절, 폐업 포함, MANUAL 포함)를 준다.
        필터는 모두 선택이고 각각 값 하나만 받는다. 여러 필터를 주면 모두 맞는 장소만 준다.
        정렬은 만든 일시(createdAt)가 빠른 순(같으면 id 순)이다. 한 번에 size개(기본 20, 최대 50)를 주고, 더 있으면 nextCursor를 준다.
        다음 페이지는 같은 필터에 cursor = nextCursor를 붙여 부른다. 필터를 바꾸면 cursor 없이 처음부터 부른다.
        맞는 장소가 없으면(없는 지역 코드 포함) items는 빈 배열이고 nextCursor는 null이다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: listPlaces
      parameters:
      - name: regionCode
        in: query
        description: 이 화면 지역 코드(regionCode)의 장소만 준다. 생략하거나 비우면 모든 지역. 없는 코드면 빈 결과(오류
          아님)
        required: false
        schema:
          type: string
        example: 11440
      - name: status
        in: query
        description: 이 검수 상태만 준다. CANDIDATE·APPROVED·REJECTED. 생략하면 모든 상태. 그 밖의 값은
          400 INVALID_REQUEST
        required: false
        schema:
          type: string
          enum:
          - CANDIDATE
          - APPROVED
          - REJECTED
        example: CANDIDATE
      - name: placeType
        in: query
        description: 이 유형만 준다. BOARD_GAME_CAFE·ESCAPE_ROOM·PARK·UNCLASSIFIED. 생략하면
          모든 유형. 그 밖의 값은 400 INVALID_REQUEST
        required: false
        schema:
          type: string
          enum:
          - BOARD_GAME_CAFE
          - ESCAPE_ROOM
          - PARK
          - UNCLASSIFIED
        example: UNCLASSIFIED
      - name: source
        in: query
        description: 이 원천만 준다. SEMAS·PARK_STANDARD·MANUAL. 생략하면 모든 원천. 그 밖의 값은 400
          INVALID_REQUEST
        required: false
        schema:
          type: string
          enum:
          - SEMAS
          - PARK_STANDARD
          - MANUAL
        example: SEMAS
      - name: closed
        in: query
        description: "true면 폐업 장소만, false면 폐업이 아닌 장소만 준다. 생략하면 둘 다"
        required: false
        schema:
          type: boolean
        example: true
      - name: keyword
        in: query
        description: |-
          장소명·도로명 주소·원천 이름·원천 도로명 주소 중 하나에 이 글자가 들어 있는 장소만 준다. 영문 대소문자는 가리지 않는다.
          %와 _도 글자 그대로 찾는다. 앞뒤 공백은 뺀다. 생략하거나 비었거나 공백뿐이면 걸지 않는다
        required: false
        schema:
          type: string
        example: 와우산로
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor를 그대로 보낸다. 생략하면 첫 페이지다. 해석할 수 없으면 400 INVALID_CURSOR
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 개수. 생략하면 20, 50보다 크면 50, 1보다 작으면 1로 맞춘다"
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 장소 한 페이지. nextCursor가 null이면 마지막 페이지다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceListResponse"
        "400":
          description: |-
            INVALID_REQUEST: status·placeType·source가 목록 밖 값이거나 closed가 true·false가 아니거나 size가 숫자가 아니다. 정상 화면 흐름에서는 나지 않는다.
            INVALID_CURSOR: 해석할 수 없는 cursor. cursor 없이 처음부터 다시 부른다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceListResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceListResponse"
    post:
      tags:
      - 어드민 장소
      summary: MANUAL 장소 등록
      description: |-
        공공데이터(적재)에 없는 장소를 직접 등록한다. 등록하면 바로 승인(APPROVED)이고 원천은 MANUAL이다.
        지역이 활성이면 바로 사용자에게 노출된다. 적재는 MANUAL 장소를 바꾸거나 폐업 처리하지 않는다.
        원천 값은 빈 문자열과 0, sourceId는 빈 문자열, lastSyncedAt은 등록 일시다.
        성공하면 201이고 data는 등록된 장소다. createdBy·updatedBy·reviewedBy가 요청한 어드민 id다.
        같은 요청을 두 번 보내면 장소가 두 개 생긴다. 응답이 올 때까지 버튼을 막는다.
        여러 조건에 걸리면 INVALID_REGION → UNCLASSIFIED_NOT_APPROVABLE 순서로 앞의 것이 온다.
      operationId: createPlace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPlaceCreateRequest"
        required: true
      responses:
        "201":
          description: 등록된 장소
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "400":
          description: |-
            INVALID_REQUEST(errors 있음): 필드 형식 오류. errors[].message를 그 입력칸 아래에 보여준다.
            INVALID_REQUEST(errors 없음): 본문 없음·잘못된 JSON·목록 밖 enum 값·숫자가 아닌 좌표. 정상 화면 흐름에서는 나지 않는다. message를 보여준다.
            INVALID_REGION: regionCode가 지역 목록에 없다. 지역을 다시 고르게 한다.
            UNCLASSIFIED_NOT_APPROVABLE: 유형 미정(UNCLASSIFIED)으로 승인하려 했다. 유형을 고르게 한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효이거나, 어드민이 승인 상태가 아니다(이용 중지됨\
            \ 포함). 재발급 후 다시 부르고, 재발급도 401이면 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminPlaceResponse"
  /api/admin/v1/auth/tokens:
    post:
      tags:
      - 어드민 인증
      summary: 어드민 access token 재발급
      description: |-
        adminRefreshToken 쿠키로 새 access token을 발급한다. credentials를 포함해 호출한다.
        어드민 앱에 들어올 때(새로고침 포함) 먼저 부르고, 401을 받은 요청을 다시 보내기 전에 부른다.
        발급하면 같은 기기의 이전 refresh token은 무효가 되므로 동시에 여러 번 호출하지 않는다.
        재발급해도 세션은 늘어나지 않는다. 로그인 후 12시간이 지나면 401이고 다시 로그인해야 한다.
        새 쿠키의 수명은 로그인 후 12시간까지 남은 시간이다. 승인이 풀린 어드민은 재발급되지 않는다.
        401 INVALID_ADMIN_REFRESH_TOKEN이면 로그인 화면으로 보낸다.
      operationId: reissue
      parameters:
      - name: adminRefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 재발급 성공. 새 adminRefreshToken 쿠키가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "401":
          description: "INVALID_ADMIN_REFRESH_TOKEN: 쿠키가 없거나 만료·위조·회전됐거나 로그아웃됐거나,\
            \ 어드민이 승인 상태가 아니다. 로그인 화면으로 보낸다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
      security: []
    delete:
      tags:
      - 어드민 인증
      summary: 어드민 로그아웃
      description: |-
        adminRefreshToken 쿠키가 가리키는 이 기기의 세션만 끝내고 쿠키를 만료시킨다. 다른 기기의 로그인은 유지된다.
        쿠키를 읽으므로 credentials를 포함해 호출한다.
        쿠키가 없거나 이미 끝난 세션이어도 200이다. 다시 호출해도 안전하다.
        이미 발급된 access token은 만료까지 유효하므로 클라이언트에서 버린다.
      operationId: logout
      parameters:
      - name: adminRefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 로그아웃 완료. adminRefreshToken 쿠키를 만료시키는 Set-Cookie가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: access token이 없거나 만료·무효. 토큰을 버리고 로그인 화면으로\
            \ 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/admin/v1/auth/signup:
    post:
      tags:
      - 어드민 인증
      summary: 어드민 가입 신청
      description: |-
        가입 화면에서 제출하면 부른다. 승인 대기 상태로 저장되고 토큰·쿠키는 주지 않는다.
        MASTER가 승인하기 전까지는 로그인하면 403 ADMIN_PENDING_APPROVAL이다.
        필드 형식이 틀리면 400 INVALID_REQUEST와 함께 errors에 틀린 필드와 문구가 담긴다.
        team에 목록 밖의 값을 보내거나 없는 날짜를 보내면 JSON 변환 단계에서 실패해 400 INVALID_REQUEST만 오고 errors는 없다.
        성공한 요청을 다시 보내면 같은 아이디가 이미 있으므로 409 DUPLICATED_LOGIN_ID다. 응답 전까지 버튼을 막는다.
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSignUpRequest"
        required: true
      responses:
        "201":
          description: 가입 신청 완료. data는 없다. 승인 대기 안내 후 로그인 화면으로 보낸다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: 필드 형식 오류. errors의 필드별 문구를 입력칸 아래에 보여준다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: "DUPLICATED_LOGIN_ID: 이미 쓰이는 아이디. 다른 아이디를 입력받는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
      security: []
  /api/admin/v1/auth/login:
    post:
      tags:
      - 어드민 인증
      summary: 어드민 로그인
      description: |-
        아이디·비밀번호로 로그인한다. access token을 본문으로, refresh token을 adminRefreshToken 쿠키로 준다.
        쿠키를 받아야 하므로 credentials를 포함해 호출한다.
        아이디가 없는 것과 비밀번호가 틀린 것은 구분하지 않고 401 INVALID_ADMIN_CREDENTIALS다.
        같은 아이디로 5회 연속 실패하면 15분 동안 잠기고(401 ADMIN_LOGIN_LOCKED), 잠긴 동안은 비밀번호가 맞아도 같은 코드다.
        비밀번호가 맞았지만 승인 대기면 403 ADMIN_PENDING_APPROVAL, 가입이 거절됐으면 403 ADMIN_REJECTED,
        이용 중지됐으면 403 ADMIN_SUSPENDED다. 비밀번호가 틀리면 상태와 관계없이 401 INVALID_ADMIN_CREDENTIALS다.
        로그인할 때마다 새 기기 세션이 생긴다. 다른 기기의 로그인은 끊기지 않는다.
        세션은 로그인 후 12시간에 끝난다. 재발급해도 늘어나지 않는다.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
        required: true
      responses:
        "200":
          description: 로그인 성공. adminRefreshToken 쿠키가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "400":
          description: "INVALID_REQUEST: 아이디나 비밀번호가 비었거나 64자를 넘는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "401":
          description: |-
            INVALID_ADMIN_CREDENTIALS: 아이디가 없거나 비밀번호가 틀렸다. 아이디 또는 비밀번호가 틀렸다고 안내한다.
            ADMIN_LOGIN_LOCKED: 같은 아이디로 5회 연속 실패해 15분 동안 잠겼다. 잠시 후 다시 시도하라고 안내한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
        "403":
          description: |-
            ADMIN_PENDING_APPROVAL: 비밀번호는 맞지만 아직 승인되지 않았다. 승인 대기 안내를 보여준다.
            ADMIN_REJECTED: 비밀번호는 맞지만 가입이 거절됐다. message를 보여준다. 이 아이디로는 다시 가입·로그인할 수 없다.
            ADMIN_SUSPENDED: 비밀번호는 맞지만 이용이 중지됐다. message를 보여준다. MASTER가 해제하면 다시 로그인할 수 있다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminTokenResponse"
