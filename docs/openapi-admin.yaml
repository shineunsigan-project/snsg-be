    AdminSignUpRequest:
      type: object
      properties:
        loginId:
          type: string
          description: 로그인 아이디. 영문 소문자로 시작하는 4~20자의 영문 소문자·숫자. 대문자는 받지 않는다. 다른 어드민과
            겹칠 수 없다
          example: mintadmin
          pattern: "^[a-z][a-z0-9]{3,19}$"
        password:
          type: string
          description: "비밀번호. 8~64자, 영문과 숫자를 각각 1자 이상. 공백 없는 영문·숫자·특수문자(ASCII)만 쓸\
            \ 수 있고 한글은 받지 않는다"
          example: mint1234!
          pattern: "^(?=.*[A-Za-z])(?=.*[0-9])[\\x21-\\x7E]{8,64}$"
        name:
          type: string
          description: 실명. 2~20자의 한글 또는 영문. 공백·숫자는 받지 않는다
          example: 김민트
          pattern: "^[가-힣a-zA-Z]{2,20}$"
        team:
          type: string
          description: |-
            소속팀. PLANNING(기획), DESIGN(디자인), FRONTEND(개발(FE)), BACKEND(개발(BE)), MARKETING(마케팅),
            OPERATIONS(운영), BUSINESS(사업개발), DATA(데이터), MANAGEMENT(경영지원)
          enum:
          - PLANNING
          - DESIGN
          - FRONTEND
          - BACKEND
          - MARKETING
          - OPERATIONS
          - BUSINESS
          - DATA
          - MANAGEMENT
          example: BACKEND
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd). 오늘(한국 시간)보다 이전이어야 한다
          example: 1996-04-12
      required:
      - birthDate
      - loginId
      - name
      - password
      - team
    ApiResponseVoid:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    AdminLoginRequest:
      type: object
      properties:
        loginId:
          type: string
          description: 로그인 아이디. 입력한 그대로 보낸다. 최대 64자
          example: mintadmin
          maxLength: 64
          minLength: 0
        password:
          type: string
          description: 비밀번호. 최대 64자
          example: mint1234!
          maxLength: 64
          minLength: 0
      required:
      - loginId
      - password
    AdminRegionResponse:
      type: object
      properties:
        code:
          type: string
          description: 지역 코드. 행정구역 시군구 코드 5자리 문자열이다. 장소의 regionCode
          example: "11440"
        sidoName:
          type: string
          description: 시도 이름
          example: 서울특별시
        sigunguName:
          type: string
          description: 시군구 이름
          example: 마포구
        isActive:
          type: boolean
          description: 서비스 중인 지역인지. false면 그 지역 장소는 승인해도 사용자에게 노출되지 않는다. 장소 등록·수정에는
            쓸 수 있다
          example: true
    ApiResponseListAdminRegionResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminRegionResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    AdminPlaceListResponse:
      type: object
      properties:
        items:
          type: array
          description: 장소. 만든 일시(createdAt)가 빠른 순(같으면 id 순)이다. 없으면 빈 배열
          items:
            $ref: "#/components/schemas/AdminPlaceResponse"
        nextCursor:
          type: string
          description: |-
            다음 페이지 커서. 다음 페이지를 부를 때 같은 필터에 그대로 cursor로 보낸다. 마지막 페이지면 null이다.
            내용을 해석하지 않는 불투명 문자열이다(영문·숫자·_·-만 쓴다)
          example: MjAyNi0xMS0wMlQxMDoxNTozMHwwMWExYTJiMy0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDE
    ApiResponseAdminPlaceListResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AdminPlaceListResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    AdminListResponse:
      type: object
      properties:
        items:
          type: array
          description: 어드민. 가입 신청 일시가 빠른 순(같으면 id 순)이다. 없으면 빈 배열
          items:
            $ref: "#/components/schemas/AdminSummaryResponse"
        nextCursor:
          type: string
          description: |-
            다음 페이지 커서. 다음 페이지를 부를 때 그대로 cursor로 보낸다. 마지막 페이지면 null이다.
            내용을 해석하지 않는 불투명 문자열이다(영문·숫자·_·-만 쓴다)
          example: MjAyNi0xMS0xM1QxMDoxNTozMHwwMTkyZjNhNC01YjZjLTdkOGUtOWYwMS0yMzQ1Njc4OWFiY2Q
    AdminSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 어드민 식별자. 승인·거절·이용 중지·해제 경로의 adminId로 쓴다
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        loginId:
          type: string
          description: 로그인 아이디
          example: mintadmin
        name:
          type: string
          description: 실명
          example: 김민트
        team:
          type: string
          description: 소속팀. 값과 이름은 가입 요청의 team과 같다
          enum:
          - PLANNING
          - DESIGN
          - FRONTEND
          - BACKEND
          - MARKETING
          - OPERATIONS
          - BUSINESS
          - DATA
          - MANAGEMENT
          example: BACKEND
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd)
          example: 1996-04-12
        role:
          type: string
          description: |-
            역할. MASTER는 DB로만 만들고 관리하므로 승인·거절·이용 중지·해제 버튼을 그리지 않는다(부르면 403 MASTER_NOT_MODIFIABLE).
            ADMIN은 가입 신청으로 생긴 일반 어드민이다
          enum:
          - MASTER
          - ADMIN
          example: ADMIN
        status:
          type: string
          description: |-
            상태. PENDING(승인 대기): [승인]·[거절]을 그린다.
            APPROVED(승인됨): [이용 중지]를 그린다.
            REJECTED(거절됨): 버튼 없음. 거절은 되돌릴 수 없고 이 아이디는 다시 쓸 수 없다.
            SUSPENDED(이용 중지): [이용 중지 해제]를 그린다
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
          example: PENDING
        createdAt:
          type: string
          format: date-time
          description: "가입 신청 일시. 한국 시간, 오프셋 없는 ISO-8601"
          example: 2026-11-13T10:15:30
    ApiResponseAdminListResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AdminListResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    AdminMeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 어드민 식별자
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        loginId:
          type: string
          description: 로그인 아이디
          example: mintadmin
        name:
          type: string
          description: 실명
          example: 김민트
        team:
          type: string
          description: 소속팀. 값과 이름은 가입 요청의 team과 같다
          enum:
          - PLANNING
          - DESIGN
          - FRONTEND
          - BACKEND
          - MARKETING
          - OPERATIONS
          - BUSINESS
          - DATA
          - MANAGEMENT
          example: BACKEND
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd)
          example: 1996-04-12
        role:
          type: string
          description: 역할. MASTER는 가입 승인 등 MASTER 전용 메뉴를 볼 수 있다. ADMIN은 일반 어드민이다
          enum:
          - MASTER
          - ADMIN
          example: ADMIN
    ApiResponseAdminMeResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/AdminMeResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  securitySchemes:
    bearerAuth:
      type: http
      description: |-
        어드민 로그인·재발급 응답 본문의 accessToken을 넣는다. Bearer는 빼고 토큰 값만 넣는다.
        사용자 앱의 토큰은 받지 않는다. refresh token은 HttpOnly 쿠키라 여기에 넣지 않는다.
      scheme: bearer
      bearerFormat: JWT