          description: 확정 참여자(개설자 포함) 요약
        place:
          $ref: "#/components/schemas/ScheduleDetailPlace"
          description: 장소. 개설 시점의 값이다. 장소 정보가 나중에 바뀌어도 이 일정에는 개설 때 값이 그대로 온다
        displayStatus:
          type: string
          description: |-
            화면에 보여줄 상태. 서버가 일정 상태·모집 상태·시각을 합쳐 정한다. FE는 이 값만 보고 배지와 비활성 버튼 문구를 정한다.
            RECRUITING: 모집 중. RECRUITMENT_CLOSED: 모집 마감(정원이 찼거나 시작 시각이 지났다).
            COMPLETED: 완료(시작 + 12시간이 지났다). CANCELED: 일정 취소됨(개설자가 취소했다)
          enum:
          - CANCELED
          - COMPLETED
          - RECRUITMENT_CLOSED
          - RECRUITING
          example: RECRUITING
        viewerRole:
          type: string
          description: |-
            보는 사람의 역할. GUEST: 로그인하지 않았다(토큰이 없거나 틀렸다). HOST: 일정을 연 사람.
            PARTICIPANT: 멤버로 참여 확정했다. NON_PARTICIPANT: 로그인했지만 참여하지 않았다(참여를 취소한 사람 포함)
          enum:
          - GUEST
          - HOST
          - PARTICIPANT
          - NON_PARTICIPANT
          example: NON_PARTICIPANT
        availableActions:
          type: array
          description: |-
            지금 누를 수 있는 동작. 들어 있는 동작의 버튼만 활성으로 그린다. 비어 있으면 누를 수 있는 버튼이 없다.
            LOGIN_TO_JOIN: [참여하기]를 누르면 로그인 화면으로 보낸다(GUEST, 모집 중).
            JOIN: [참여하기](NON_PARTICIPANT, 모집 중). CANCEL_PARTICIPATION: [참여 취소](PARTICIPANT, 모집 중·모집 마감).
            CANCEL_SCHEDULE: [일정 취소](HOST, 취소·완료되지 않았고 시작 전)
          example:
          - JOIN
          items:
            type: string
            enum:
            - LOGIN_TO_JOIN
            - JOIN
            - CANCEL_PARTICIPATION
            - CANCEL_SCHEDULE
    ApiResponseListScheduleParticipant:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleParticipant"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ScheduleParticipant:
      type: object
      description: 참여자 명단의 한 사람. 이름·이메일·생년월일·사용자 ID는 주지 않는다
      properties:
        nickname:
          type: string
          description: 닉네임. 탈퇴했으면 "탈퇴한 사용자"
          example: 민트초코
        profileImageUrl:
          type: string
          description: 프로필 사진 경로. 도메인 없이 경로만 온다. 탈퇴했으면 기본 이미지 경로
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
        gender:
          type: string
          description: "성별. MALE 남자, FEMALE 여자. 탈퇴한 사람도 저장된 성별이 온다. 사용자 정보를 찾을 수 없\
            으면 null"
          enum:
          - FEMALE
          - MALE
          example: FEMALE
        ageGroup:
          $ref: "#/components/schemas/ScheduleDetailAgeGroup"
          description: 연령대. 탈퇴했거나 사용자 정보를 찾을 수 없으면 null
        isHost:
          type: boolean
          description: 개설자면 true. 명단에서 개설자는 항상 맨 앞 한 명이다
          example: true
        isMe:
          type: boolean
          description: 보는 사람 본인이면 true. 개설자가 보면 개설자 항목이 isHost·isMe 모두 true다
          example: false
        withdrawn:
          type: boolean
          description: 탈퇴했거나 사용자 정보를 찾을 수 없으면 true. 화면에 탈퇴 표시를 붙일 때 쓴다
          example: false
    ApiResponseListRegionResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegionResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    RegionResponse:
      type: object
      properties:
        code:
          type: string
          description: 지역 코드. 행정구역 시군구 코드 5자리 문자열이다
          example: "11440"
        name:
          type: string
          description: 화면에 보여줄 지역 이름. 시군구 이름이다
          example: 마포구
    ApiResponseListPlaceCandidateResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlaceCandidateResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    PlaceCandidateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 장소 ID. 일정 개설 요청의 placeId로 보낸다
          example: 01a1a2b3-0000-7000-8000-000000000001
        name:
          type: string
          description: 장소명
          example: 보드게임카페 홍대점
        roadAddress:
          type: string
          description: 도로명주소. 없으면 지번주소다. 상세주소(층 등)는 들어 있지 않다
          example: 서울특별시 마포구 와우산로 1
        addressDetail:
          type: string
          description: 상세주소(층 등). 없으면 빈 문자열이다. 표시할 때 도로명주소 뒤에 붙인다
          example: 2층
        latitude:
          type: number
          description: 위도. WGS84 소수
          example: 37.5512345
        longitude:
          type: number
          description: 경도. WGS84 소수
          example: 126.9212345
        regionCode:
          type: string
          description: 장소가 속한 지역 코드. 지역 목록 API의 code와 같은 5자리 문자열이다
          example: 11440
    ApiResponseSignUpSessionResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/SignUpSessionResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    SignUpSessionResponse:
      type: object
      properties:
        nickname:
          type: string
          description: 소셜에서 받아온 닉네임. 화면의 기본값으로 쓰고 사용자가 바꿀 수 있다. 소셜이 주지 않으면 비어 있다
          example: 민트초코
        profileImageUrl:
          type: string
          description: 소셜에서 받아온 프로필 사진. 기본 이미지였거나 받지 못하면 비어 있다
          example: https://k.kakaocdn.net/dn/abc/profile.jpg
    ActivityCategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 활동 ID. 다른 API에 활동을 넘길 때 이 값을 쓴다
          example: 01a19cc6-3d80-7000-8000-000000000001
        code:
          type: string
          description: 활동 코드. 화면에 보여줄 이름(name)이 바뀌어도 그대로인 식별자다
          example: BOARD_GAME
        name:
          type: string
          description: 화면에 보여줄 활동 이름
          example: 보드게임
    ApiResponseListActivityCategoryResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActivityCategoryResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  securitySchemes:
    bearerAuth:
      type: http
      description: |-
        로그인·가입·재발급 응답 본문의 accessToken을 넣는다. Bearer는 빼고 토큰 값만 넣는다.
        refresh token은 HttpOnly 쿠키라 여기에 넣지 않는다.
      scheme: bearer
      bearerFormat: JWT