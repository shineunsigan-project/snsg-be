        message:
          type: string
        data:
          $ref: "#/components/schemas/TokenResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 인증이 필요한 API의 Authorization 헤더에 Bearer로 넣는다. 30분 뒤 만료되며 메모리에만
            보관한다
    SignUpRequest:
      type: object
      properties:
        name:
          type: string
          description: 실명. 2~20자의 한글 또는 영문만 쓸 수 있다. 공백·숫자는 받지 않는다. 남에게 보이지 않고 가입 후
            바꿀 수 없다
          example: 김민트
          pattern: "^[가-힣a-zA-Z]{2,20}$"
        nickname:
          type: string
          description: 일정에서 다른 사람에게 보일 이름. 2~10자의 한글·영문·숫자·.·_만 쓸 수 있다. 대소문자만 다른 닉네임은
            같은 닉네임으로 본다. 소셜 닉네임이 기본값이고 바꿀 수 있다
          example: 민트초코
          pattern: "^[가-힣a-zA-Z0-9._]{2,10}$"
        email:
          type: string
          description: "이메일. 선택 입력이다. 생략하거나 빈 문자열이면 없음으로 저장한다. local@domain.tld 형식\
            , 최대 100자. 앞뒤 공백은 다듬지 않고 거부한다. 대소문자는 입력한 그대로 저장한다"
          example: mint@example.com
          maxLength: 100
          minLength: 0
          pattern: "^([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,})?$"
        gender:
          type: string
          description: 성별. 일정 참여자 구성 표시에 쓰인다
          enum:
          - FEMALE
          - MALE
          example: FEMALE
        birthDate:
          type: string
          format: date
          description: 생년월일. 연령대 계산에 쓰이고 생년월일 자체는 공개되지 않는다. 가입일 기준 만 18세 이상이어야 한다
          example: 1996-04-12
        profileImageUrl:
          type: string
          description: "프로필 사진 업로드 API가 돌려준 경로. 비워 두면 소셜에서 받아온 사진을 쓰고, 그것도 없으면 기본\
            \ 이미지가 된다"
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
      required:
      - birthDate
      - gender
      - name
      - nickname
    UpdateMyProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 새 닉네임. 바꾸지 않으면 생략한다. 2~10자의 한글·영문·숫자·.·_만 쓸 수 있다. 현재와 정확히 같은
            값은 바꾸지 않은 것으로 본다. 대소문자만 달라도 변경이다. 마지막 변경 후 14일 안에는 바꿀 수 없다
          example: 민트라떼
          pattern: "^[가-힣a-zA-Z0-9._]{2,10}$"
        email:
          type: string
          description: "새 이메일. 바꾸지 않으면 생략한다. 빈 문자열이면 이메일을 지운다. local@domain.tld 형식\
            , 최대 100자. 앞뒤 공백은 다듬지 않고 거부한다"
          example: mint@example.com
          maxLength: 100
          minLength: 0
          pattern: "^([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,})?$"
        profileImageUrl:
          type: string
          description: "새 프로필 사진 경로. 바꾸지 않으면 생략한다. 프로필 사진 업로드 API(POST /api/v1/users/me/profile-image)가\
            \ 돌려준 경로만 받는다. 빈 문자열, 다른 주소, 형식을 바꾼 경로, 다른 회원이 쓰고 있는 경로는 400 INVALID_PROFILE_IMAGE_URL이\
            다. 바꾸면 이전에 올렸던 사진 파일은 지워진다"
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
    AgeGroupResponse:
      type: object
      properties:
        decade:
          type: integer
          format: int32
          description: 십의 자리 × 10. 20이면 20대다. 만 18·19세는 10이다
          example: 20
        phase:
          type: string
          description: "EARLY 초반(일의 자리 0~3), MID 중반(4~6), LATE 후반(7~9). 18·19세는 10대\
            \ 후반(LATE)이다"
          enum:
          - EARLY
          - MID
          - LATE
          example: LATE
    ApiResponseMyProfileResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
