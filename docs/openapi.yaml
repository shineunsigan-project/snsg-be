openapi: 3.1.0
info:
  title: snsg API
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: 인증
  description: "소셜 로그인, 가입, 토큰 재발급"
paths:
  /api/v1/schedules:
    post:
      tags:
      - 일정
      summary: 일정 개설
      description: |-
        일정을 연다. 일정 개설 화면의 [일정 열기]에서 부른다. 로그인이 필요하다.
        개설자는 확정 참여자 1명으로 함께 들어가고, 일정은 모집 중 상태로 시작한다.
        장소는 placeId만 보낸다. 서버가 장소의 이름·주소·좌표를 읽어 개설 시점 값으로 일정에 저장한다.
        두 번 눌려 같은 요청이 두 번 와도 일정은 하나만 생긴다. 두 번째 요청은 409 SCHEDULE_TIME_CONFLICT다.
        그래도 첫 응답을 받기 전까지 버튼을 막는다.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
        required: true
      responses:
        "201":
          description: 개설 완료. data.scheduleId가 만든 일정의 ID다. 내가 연 일정 목록(LIST-05)으로 이동하고
            개설 완료 팝업을 띄운다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
        "400":
          description: |-
            INVALID_REQUEST: 필수값 누락, 활동명·설명 길이 위반(errors에 필드별 문구), 없는 durationType 값.
            INVALID_CATEGORY: 없거나 숨긴 활동. 활동 목록을 다시 불러 고르게 한다.
            INVALID_PLACE: 없거나 노출이 끝난 장소, 활동과 유형이 다른 장소. 장소를 다시 고르게 한다.
            INVALID_START_AT: 30분 단위가 아니거나 지금 + 1시간보다 이르거나 오늘 + 30일보다 늦은 시작 일시. 시작 일시를 다시 고르게 한다.
            INVALID_CAPACITY: 개설자 포함 4~24명 밖의 인원.
            INVALID_TITLE·INVALID_DESCRIPTION: 서버의 안전망. 요청 검증을 통과한 값이면 나지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
        "401":
          description: |-
            UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다.
            USER_NOT_ACTIVE: 탈퇴한 사용자. 로그인 화면으로 간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
        "409":
          description: |-
            SCHEDULE_TIME_CONFLICT: 내가 개설했거나 참여 확정한 예정 일정과 시작 시각이 12시간 미만으로 떨어진다.
            정확히 12시간 차이는 허용한다. 시작 일시를 바꾸게 안내한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
  /api/v1/auth/tokens:
    post:
      tags:
      - 인증
      summary: access token 재발급
      description: |-
        refreshToken 쿠키로 새 access token을 발급한다. credentials를 포함해 호출한다.
        로그인한 기기마다 세션이 따로 있다. 발급하면 같은 기기의 이전 refresh token은 무효가 되므로 동시에 여러 번 호출하지 않는다.
        다른 기기의 세션에는 영향이 없다.
        401 INVALID_REFRESH_TOKEN이면 로그인 화면으로 보낸다.
      operationId: reissue
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
      security: []
    delete:
      tags:
      - 인증
      summary: 로그아웃
      description: |-
        refreshToken 쿠키가 가리키는 이 기기의 세션만 끝내고 쿠키를 만료시킨다. 다른 기기의 로그인은 유지된다.
        쿠키를 읽으므로 credentials를 포함해 호출한다.
        쿠키가 없거나 이미 끝난 세션이어도 200이다. 다시 호출해도 안전하다.
        이미 발급된 access token은 만료까지 유효하므로 클라이언트에서 버린다.
      operationId: logout
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/auth/signup:
    post:
      tags:
      - 인증
      summary: 가입 완료
      description: |-
        프로필을 받아 가입을 마치고 access token을 돌려준다. signUpToken 쿠키가 필요하므로 credentials를 포함해 호출한다.
        소셜 정보는 서버가 보관한 가입 세션에서 꺼낸다. 가입이 끝나면 signUpToken은 무효가 된다.
        필드 형식이 틀리면 400 INVALID_REQUEST와 함께 errors에 틀린 필드와 문구가 담긴다.
        가입일 기준 만 18세 미만이면 400 UNDERAGE, 닉네임이 이미 쓰이고 있으면(대소문자 무시) 409 DUPLICATED_NICKNAME이다.
      operationId: signUp
      parameters:
      - name: signUpToken
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
      security: []
  /api/v1/auth/signup/profile-image:
    post:
      tags:
      - 인증
      summary: 프로필 사진 업로드
      description: |-
        가입 중에 프로필 사진을 바꿀 때 쓴다. 돌려받은 경로를 가입 요청의 profileImageUrl에 넣는다.
        5MB 이하의 JPG·PNG만 받는다. 형식은 파일 내용으로 판별하므로 확장자를 바꿔 올려도 거부된다.
      operationId: uploadProfileImage
      parameters:
      - name: signUpToken
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileImageResponse"
      security: []
  /api/v1/users/nickname-availability:
    get:
      tags:
      - 사용자
      summary: 닉네임 사용 가능 여부
      description: |-
        입력한 닉네임을 쓸 수 있는지 알려준다. 가입 닉네임 입력 화면과 프로필 수정 화면에서 닉네임 칸을 벗어날 때 부른다.
        결과는 안내용이다. 가입·프로필 수정 API가 저장할 때 같은 검사를 다시 하므로, 여기서 true였어도 그 사이 다른 사람이 쓰면 가입·수정이 DUPLICATED_NICKNAME으로 실패할 수 있다.
        토큰은 선택이다. 가입 중에는 토큰 없이 부른다. 토큰이 있으면 본인의 현재 닉네임은 사용 가능(true)으로 본다(대소문자 무시).
        토큰이 틀리거나 만료돼도 401이 아니라 익명으로 처리한다. 이때는 본인 닉네임도 사용 중으로 나온다.
        판정 순서: 형식(2~10자의 한글·영문·숫자·.·_)이 틀리면 INVALID_FORMAT, 본인의 현재 닉네임이면 true,
        다른 회원이 쓰고 있거나 보호 기간(변경 전 14일, 탈퇴 90일)이 남았으면 DUPLICATED. 대소문자는 무시한다.
        DUPLICATED는 사용 중과 보호 중을 구분하지 않는다. 보호 중임을 알리면 다른 회원의 탈퇴·변경 여부가 드러나기 때문이다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: checkNicknameAvailability
      parameters:
      - name: nickname
        in: query
        description: 확인할 닉네임. 2~10자의 한글·영문·숫자·.·_
        required: true
        schema:
          type: string
        example: 민트초코
      responses:
        "200":
          description: 판정 결과. 형식 오류·중복도 200이고 data.available과 data.reason으로 알려준다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNicknameAvailabilityResponse"
        "400":
          description: "INVALID_REQUEST: nickname 파라미터가 없다. 빈 값(?nickname=)은 400이\
            \ 아니라 200 INVALID_FORMAT이다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNicknameAvailabilityResponse"
  /api/v1/regions:
    get:
      tags:
      - 지역
      summary: 지역 목록
      description: |-
        서비스 중인 지역 목록. 일정 목록의 지역 필터와 장소 선택의 지역 칩을 그릴 때 부른다.
        토큰 없이 부를 수 있다. 서비스하지 않는(비활성) 지역은 빠지고, 서버가 정한 노출 순서(display_order)대로 온다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: findRegions
      responses:
        "200":
          description: 노출 순서대로 정렬된 지역 목록
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListRegionResponse"
      security: []
  /api/v1/place-candidates:
    get:
      tags:
      - 장소 후보
      summary: 장소 후보
      description: |-
        활동이 고를 수 있는 유형의 장소 목록(보드게임 → 보드게임카페, 방탈출 → 방탈출 매장, 산책 → 공원).
        장소 선택 화면에 들어올 때와 지역 칩을 바꿀 때 부른다. 목록과 지도 핀을 이 결과로 그리고, 고른 장소의 id를 일정 개설의 placeId로 보낸다.
        토큰 없이 부를 수 있다. 검수를 통과하고 영업 중인, 서비스 중인 지역의 장소만 온다.
        정렬은 지역 노출 순서(display_order), 그 안에서 장소명 순이다. 페이지를 나누지 않는다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: listPlaceCandidates
      parameters:
      - name: categoryId
        in: query
        description: 활동 ID. 활동 목록 API의 id
        required: true
        schema:
          type: string
          format: uuid
        example: 01a19cc6-3d80-7000-8000-000000000001
      - name: regionCode
        in: query
        description: 지역 코드. 지역 목록 API의 code. 생략하면 서비스 중인 지역 전체다. 빈 값으로 보내지 않는다
        required: false
        schema:
          type: string
        example: 11440
      responses:
        "200":
          description: 정렬된 장소 후보 목록. 조건에 맞는 장소가 없으면 빈 배열이고 화면에 결과 없음을 보여준다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPlaceCandidateResponse"
        "400":
          description: |-
            INVALID_REQUEST: categoryId가 없거나 UUID 형식이 아니다.
            INVALID_CATEGORY: 없거나 숨긴 활동. 활동 목록을 다시 불러 고르게 한다. 지역도 틀렸어도 이 코드가 온다.
            INVALID_REGION: 없거나 서비스하지 않는 지역, 빈 값으로 보낸 regionCode. 지역 목록을 다시 불러 고르게 한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPlaceCandidateResponse"
      security: []
  /api/v1/auth/{provider}/callback:
    get:
      tags:
      - 인증
      summary: 소셜 인증 콜백
      description: |-
        소셜이 호출하는 주소다. 클라이언트가 직접 부르지 않는다.
        기존 회원이면 refreshToken 쿠키를, 신규면 signUpToken 쿠키를 심고 프론트엔드로 302 리다이렉트한다.
        신규는 쿼리로 signUp=true가 붙는다. 토큰은 URL에 담지 않는다.
      operationId: callback
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - KAKAO
          - NAVER
          - APPLE
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        "302":
          description: 프론트엔드로 이동. 쿠키가 심어진다
      security: []
  /api/v1/auth/{provider}/authorize:
    get:
      tags:
      - 인증
      summary: 소셜 로그인 시작
      description: |-
        소셜 인증 페이지로 302 리다이렉트한다. 클라이언트는 소셜 앱 키를 갖지 않는다.
        **fetch나 XHR로 부르지 않는다.** 브라우저를 이동시켜야 한다(window.location.href = ...).
        fetch는 리다이렉트를 따라가 소셜 도메인에 닿고, 소셜은 CORS 헤더를 주지 않아 실패한다.
        같은 이유로 Swagger의 Try it out에서도 실패한다. 주소창에 직접 입력해 시험한다.
      operationId: authorize
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - KAKAO
          - NAVER
          - APPLE
      responses:
        "302":
          description: 소셜 인증 페이지로 이동. Location 헤더에 주소가 담긴다
      security: []
  /api/v1/auth/signup/session:
    get:
      tags:
      - 인증
      summary: 가입 세션 조회
      description: |-
        프로필 완성 화면의 기본값(소셜 닉네임·사진)을 돌려준다. signUpToken 쿠키가 필요하므로 credentials를 포함해 호출한다.
        세션이 만료되면 401 INVALID_SIGNUP_TOKEN이 오고, 소셜 로그인부터 다시 해야 한다.
      operationId: signUpSession
      parameters:
      - name: signUpToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSignUpSessionResponse"
      security: []
  /api/v1/activity-categories:
    get:
      tags:
      - 활동
      summary: 활동 목록
      description: |-
        고를 수 있는 활동(보드게임·방탈출·산책 등) 목록. 일정 개설의 활동 선택과 일정 목록의 활동 필터를 그릴 때 부른다.
        토큰 없이 부를 수 있다. 숨긴(비활성) 활동은 빠지고, 서버가 정한 노출 순서(display_order)대로 온다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: findActivityCategories
      responses:
        "200":
          description: 노출 순서대로 정렬된 활동 목록
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListActivityCategoryResponse"
      security: []
  /api/v1/users/me:
    delete:
      tags:
      - 사용자
      summary: 탈퇴
      description: |-
        사용자를 탈퇴시킨다. 이름·이메일·닉네임·생년월일·프로필 사진은 비식별 값으로 바뀌고 올렸던 사진 파일은 지워진다.
        카카오 연결도 끊어지므로 다시 로그인하면 동의 화면부터 시작한다.
        되돌릴 수 없고, 다시 가입하면 이전 활동과 이어지지 않는 새 계정이 된다.
        refresh token은 즉시 무효가 되지만 쿠키는 남는다. 탈퇴 직후 로그아웃 API를 한 번 호출해 쿠키를 비운다.
      operationId: withdraw
      responses:
        "200":
          description: 탈퇴 완료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: 토큰이 없거나 유효하지 않다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    CreateScheduleRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: 활동 ID. 활동 목록 API(GET /api/v1/activity-categories) 응답의 id
          example: 01a19cc6-3d80-7000-8000-000000000001
        placeId:
          type: string
          format: uuid
          description: 장소 ID. 장소 후보 API 응답의 id. 장소는 활동이 고를 수 있는 유형이어야 한다. 장소명·주소·좌표는
            보내지 않는다(서버가 장소에서 읽어 저장한다)
          example: 01a1a2b3-0000-7000-8000-000000000001
        title:
          type: string
          description: 활동명. 앞뒤 공백을 뺀 길이로 1~20자. 저장되는 값은 앞뒤 공백을 뺀 값이다
          example: 보드게임 같이 해요
          pattern: "^\\s*\\S(?:[\\s\\S]{0,18}\\S)?\\s*$"
        durationType:
          type: string
          description: "예상 소요 시간. SHORT 1시간 내외(60분), NORMAL 2시간 내외(120분), LONG 3시간\
            \ 이상(180분)"
          enum:
          - SHORT
          - NORMAL
          - LONG
          example: NORMAL
        description:
          type: string
          description: 간략 설명. 앞뒤 공백을 뺀 길이로 10~500자. 줄바꿈을 쓸 수 있다. 저장되는 값은 앞뒤 공백을 뺀
            값이다
          example: 처음 오시는 분도 환영해요. 룰은 같이 배우면서 해요.
          pattern: "^\\s*\\S[\\s\\S]{8,498}\\S\\s*$"
        startAt:
          type: string
          format: date-time
          description: 시작 일시. 오프셋 없는 한국 시간. 분은 00 또는 30이고 초는 0. 지금 + 1시간 이후(같으면 허용)이고
            시작 날짜가 오늘 + 30일 이내
          example: 2026-11-07T19:30:00
        capacity:
          type: integer
          format: int32
          description: 인원. 개설자를 포함한 전체 인원으로 4~24
          example: 6
      required:
      - capacity
      - categoryId
      - description
      - durationType
      - placeId
      - startAt
      - title
    ApiResponseCreateScheduleResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/CreateScheduleResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    CreateScheduleResponse:
      type: object
      properties:
        scheduleId:
          type: string
          format: uuid
          description: 만든 일정의 ID
          example: 01a1a2b3-4c5d-7e6f-8a9b-0c1d2e3f4a5b
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ApiResponseTokenResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/TokenResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 인증이 필요한 API의 Authorization 헤더에 Bearer로 넣는다. 30분 뒤 만료되며 메모리에만
            보관한다
    SignUpRequest:
      type: object
      properties:
        name:
          type: string
          description: 실명. 2~20자의 한글 또는 영문만 쓸 수 있다. 공백·숫자는 받지 않는다. 남에게 보이지 않고 가입 후
            바꿀 수 없다
          example: 김민트
          pattern: "^[가-힣a-zA-Z]{2,20}$"
        nickname:
          type: string
          description: 일정에서 다른 사람에게 보일 이름. 2~10자의 한글·영문·숫자·.·_만 쓸 수 있다. 대소문자만 다른 닉네임은
            같은 닉네임으로 본다. 소셜 닉네임이 기본값이고 바꿀 수 있다
          example: 민트초코
          pattern: "^[가-힣a-zA-Z0-9._]{2,10}$"
        email:
          type: string
          description: "이메일. 선택 입력이다. 생략하거나 빈 문자열이면 없음으로 저장한다. local@domain.tld 형식\
            , 최대 100자. 앞뒤 공백은 다듬지 않고 거부한다. 대소문자는 입력한 그대로 저장한다"
          example: mint@example.com
          maxLength: 100
          minLength: 0
          pattern: "^([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,})?$"
        gender:
          type: string
          description: 성별. 일정 참여자 구성 표시에 쓰인다
          enum:
          - FEMALE
          - MALE
          example: FEMALE
        birthDate:
          type: string
          format: date
          description: 생년월일. 연령대 계산에 쓰이고 생년월일 자체는 공개되지 않는다. 가입일 기준 만 18세 이상이어야 한다
          example: 1996-04-12
        profileImageUrl:
          type: string
          description: "프로필 사진 업로드 API가 돌려준 경로. 비워 두면 소셜에서 받아온 사진을 쓰고, 그것도 없으면 기본\
            \ 이미지가 된다"
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
      required:
      - birthDate
      - gender
      - name
      - nickname
    ApiResponseProfileImageResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/ProfileImageResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ProfileImageResponse:
      type: object
      properties:
        profileImageUrl:
          type: string
          description: 저장된 사진 경로. 가입 요청의 profileImageUrl에 그대로 넣는다
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
    ApiResponseNicknameAvailabilityResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/NicknameAvailabilityResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    NicknameAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
          description: 쓸 수 있는 닉네임이면 true
          example: false
        reason:
          type: string
          description: |-
            쓸 수 없는 이유. available이 true면 null이다.
            INVALID_FORMAT: 2~10자의 한글·영문·숫자·.·_가 아니다. 형식 안내 문구를 보여준다.
            DUPLICATED: 다른 회원이 쓰고 있거나 보호 기간(변경 전 14일, 탈퇴 90일)이 남은 닉네임이다. 둘을 구분하지 않는다. 다른 닉네임을 입력하게 한다
          enum:
          - INVALID_FORMAT
          - DUPLICATED
          example: DUPLICATED
    ApiResponseListRegionResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegionResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    RegionResponse:
      type: object
      properties:
        code:
          type: string
          description: 지역 코드. 행정구역 시군구 코드 5자리 문자열이다
          example: "11440"
        name:
          type: string
          description: 화면에 보여줄 지역 이름. 시군구 이름이다
          example: 마포구
    ApiResponseListPlaceCandidateResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlaceCandidateResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    PlaceCandidateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 장소 ID. 일정 개설 요청의 placeId로 보낸다
          example: 01a1a2b3-0000-7000-8000-000000000001
        name:
          type: string
          description: 장소명
          example: 보드게임카페 홍대점
        roadAddress:
          type: string
          description: 도로명주소. 없으면 지번주소다. 상세주소(층 등)는 들어 있지 않다
          example: 서울특별시 마포구 와우산로 1
        addressDetail:
          type: string
          description: 상세주소(층 등). 없으면 빈 문자열이다. 표시할 때 도로명주소 뒤에 붙인다
          example: 2층
        latitude:
          type: number
          description: 위도. WGS84 소수
          example: 37.5512345
        longitude:
          type: number
          description: 경도. WGS84 소수
          example: 126.9212345
        regionCode:
          type: string
          description: 장소가 속한 지역 코드. 지역 목록 API의 code와 같은 5자리 문자열이다
          example: 11440
    ApiResponseSignUpSessionResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/SignUpSessionResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    SignUpSessionResponse:
      type: object
      properties:
        nickname:
          type: string
          description: 소셜에서 받아온 닉네임. 화면의 기본값으로 쓰고 사용자가 바꿀 수 있다. 소셜이 주지 않으면 비어 있다
          example: 민트초코
        profileImageUrl:
          type: string
          description: 소셜에서 받아온 프로필 사진. 기본 이미지였거나 받지 못하면 비어 있다
          example: https://k.kakaocdn.net/dn/abc/profile.jpg
    ActivityCategoryResponse:
      type: object
      properties:
        id:
          type: string
