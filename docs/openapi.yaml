          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    WithdrawalEligibilityResponse:
      type: object
      properties:
        withdrawable:
          type: boolean
          description: "지금 탈퇴할 수 있는지. true면 탈퇴 재확인 팝업을, false면 탈퇴 불가 팝업을 띄운다"
          example: false
        availableAt:
          type: string
          format: date-time
          description: |-
            탈퇴할 수 있게 되는 시각. 한국 시간 ISO-8601(오프셋 없음).
            탈퇴를 막는 일정 중 시작 시각이 가장 늦은 일정의 시작 + 24시간이다. 탈퇴 불가 팝업에 안내할 때 쓴다.
            withdrawable이 true면 null이다
          example: 2026-11-15T19:00:00
    ApiResponseScheduleCardPageResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/ScheduleCardPageResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ScheduleCardCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 활동 ID
          example: 01a19cc6-3d80-7000-8000-000000000001
        name:
          type: string
          description: 활동 이름. 지금은 고를 수 없는(숨긴) 활동이어도 이름이 온다. 활동 정보를 찾을 수 없으면 빈 문자열
          example: 보드게임
    ScheduleCardPageResponse:
      type: object
      properties:
        items:
          type: array
          description: 일정 카드. 시작 일시가 빠른 순이다. 없으면 빈 배열
          items:
            $ref: "#/components/schemas/ScheduleCardResponse"
        nextCursor:
          type: string
          description: |-
            다음 페이지 커서. 다음 페이지를 부를 때 그대로 cursor로 보낸다. 마지막 페이지면 null이다.
            내용을 해석하지 않는 불투명 문자열이다(영문·숫자·_·-만 쓴다)
          example: MjAyNi0xMS0xNFQxOTozMHwwMWExYzNkNC0wMDAwLTcwMDAtODAwMC0wMDAwMDAwMDAwMDE
    ScheduleCardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 일정 ID. 일정 상세로 갈 때 쓴다
          example: 01a1c3d4-0000-7000-8000-000000000001
        category:
          $ref: "#/components/schemas/ScheduleCardCategory"
          description: 활동
        title:
          type: string
          description: 활동명(일정 제목)
          example: 보드게임 같이 해요
        regionName:
          type: string
          description: "지역 이름(시군구). 지역 정보를 찾을 수 없으면 빈 문자열이고, 그때는 지역을 표시하지 않는다"
          example: 마포구
        startAt:
          type: string
          format: date-time
          description: "시작 일시. 한국 시간, 오프셋 없는 ISO-8601"
          example: 2026-11-14T19:30:00
        confirmedCount:
          type: integer
          format: int32
          description: 확정 인원. 개설자를 포함한다
          example: 3
        capacity:
          type: integer
          format: int32
          description: 정원. 개설자를 포함한다
          example: 6
        remainingSeats:
          type: integer
          format: int32
          description: 남은 자리 = capacity − confirmedCount. 0이면 정원이 찼다
          example: 3
        displayStatus:
          type: string
          description: |-
            화면에 보여줄 상태. 서버가 일정 상태·모집 상태·시각을 합쳐 정한다. FE는 이 값만 보고 배지를 그린다.
            RECRUITING: 모집 중. RECRUITMENT_CLOSED: 모집 마감(정원이 찼거나 시작 시각이 지났다).
            CANCELED: 일정 취소됨(개설자가 취소했다. 참여한·개설한 목록에만 나온다).
            COMPLETED: 완료. 목록에는 나오지 않는다
          enum:
          - CANCELED
          - COMPLETED
          - RECRUITMENT_CLOSED
          - RECRUITING
          example: RECRUITING
        createdAt:
          type: string
          format: date-time
          description: "개설 일시. 한국 시간, 오프셋 없는 ISO-8601. NEW 배지를 붙일지 정할 때 쓴다"
          example: 2026-11-10T09:12:34.567
