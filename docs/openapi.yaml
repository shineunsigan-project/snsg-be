          type: string
        message:
          type: string
        data: {}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  securitySchemes:
    bearerAuth:
      type: http
      description: |-
        로그인·가입·재발급 응답 본문의 accessToken을 넣는다. Bearer는 빼고 토큰 값만 넣는다.
        refresh token은 HttpOnly 쿠키라 여기에 넣지 않는다.
      scheme: bearer
      bearerFormat: JWT