            $ref: "#/components/schemas/FieldError"
    MyProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 사용자 ID
          example: 01a19cc6-3d80-7000-8000-000000000001
        name:
          type: string
          description: 실명. 바꿀 수 없다
          example: 김민트
        nickname:
          type: string
          description: 닉네임
          example: 민트초코
        gender:
          type: string
          description: "성별. FEMALE 여성, MALE 남성. 바꿀 수 없으므로 읽기 전용으로 보여준다"
          enum:
          - FEMALE
          - MALE
          example: FEMALE
        birthDate:
          type: string
          format: date
          description: 생년월일(yyyy-MM-dd). 바꿀 수 없다
          example: 1996-04-12
        email:
          type: string
          description: 이메일. 등록하지 않았으면 빈 문자열이다(null이 아니다)
          example: mint@example.com
        profileImageUrl:
          type: string
          description: 프로필 사진 경로. 도메인 없이 경로만 온다. 사진을 올리지 않았으면 소셜 사진 주소나 기본 이미지 경로다
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
        ageGroup:
          $ref: "#/components/schemas/AgeGroupResponse"
          description: 연령대. 오늘(한국 시간) 기준 만 나이로 계산한다
        nicknameChangeableAt:
          type: string
          format: date-time
          description: |-
            닉네임을 다시 바꿀 수 있는 시각. 한국 시간 ISO-8601(오프셋 없음).
            마지막 닉네임 변경 후 14일이 지나지 않았으면 그 시각이고, 지금 바꿀 수 있으면(바꾼 적이 없을 때 포함) null이다.
            값이 있으면 닉네임 칸을 막고 이 날짜를 안내한다
          example: 2026-11-23T14:30:00
    ApiResponseNicknameAvailabilityResponse:
      type: object
