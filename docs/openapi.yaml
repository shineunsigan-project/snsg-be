openapi: 3.1.0
info:
  title: snsg API
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: 인증
  description: "소셜 로그인, 가입, 토큰 재발급"
paths:
  /api/v1/users/me/profile-image:
    post:
      tags:
      - 사용자
      summary: 프로필 사진 업로드
      description: |-
        프로필 수정 화면(MY-02)에서 사진을 고르면 부른다. multipart 파트 이름은 image다.
        저장만 하고 프로필에는 반영하지 않는다. 돌려받은 경로를 프로필 수정 요청(PATCH /api/v1/users/me)의 profileImageUrl에 넣어 저장해야 반영된다.
        5MB 이하의 JPG·PNG만 받는다. 형식은 파일 내용으로 판별하므로 확장자를 바꿔 올려도 거부된다.
        다시 보내면 새 파일로 저장되고 다른 경로를 돌려준다. 마지막에 받은 경로만 프로필 수정에 넣으면 된다.
      operationId: uploadProfileImage
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "200":
          description: 저장 완료. data.profileImageUrl을 프로필 수정 요청에 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileImageResponse"
        "400":
          description: "INVALID_PROFILE_IMAGE: JPG·PNG가 아니거나 비어 있다. 다른 사진을 고르게 한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileImageResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileImageResponse"
        "500":
          description: "PROFILE_IMAGE_STORE_FAILED: 서버가 사진을 저장하지 못했다. 잠시 후 다시 시도하게\
            \ 한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileImageResponse"
  /api/v1/schedules:
    get:
      tags:
      - 일정
      summary: 모집 중 일정 목록
      description: |-
        참여할 수 있는 일정을 카드로 보여준다. 목록 화면의 모집 중 탭에 들어올 때, 필터(활동·지역·날짜)를 바꿀 때,
        끝까지 스크롤해 다음 페이지가 필요할 때 부른다. 토큰 없이 부를 수 있고, 토큰을 보내도 응답은 같다.
        취소되지 않았고 시작 전인 일정이 모두 온다. 정원이 찬 일정도 displayStatus = RECRUITMENT_CLOSED(모집 마감)로 함께 온다.
        정렬은 시작 일시가 빠른 순(같으면 id 순)이다. 한 번에 size개(기본 20, 최대 50)를 주고, 더 있으면 nextCursor를 준다.
        다음 페이지는 같은 필터에 cursor = nextCursor를 붙여 부른다. 필터를 바꾸면 cursor 없이 처음부터 부른다.
        맞는 일정이 없으면 items는 빈 배열이고 nextCursor는 null이다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
        날짜와 커서가 둘 다 틀리면 INVALID_DATE_FILTER가 온다.
      operationId: listRecruiting
      parameters:
      - name: categoryIds
        in: query
        description: |-
          활동 ID. 활동 목록 API의 id. 여러 개면 categoryIds=a&categoryIds=b처럼 반복해 보내고, 그중 하나에 맞으면 온다.
          생략하면 모든 활동이다. 모르는 ID만 보내면 빈 결과다. 빈 값으로 보내지 않는다(맞는 일정이 없어 빈 결과가 된다).
          중복을 빼고 최대 20개. 넘으면 400 INVALID_REQUEST
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
        example: 01a19cc6-3d80-7000-8000-000000000001
      - name: regionCodes
        in: query
        description: |-
          지역 코드. 지역 목록 API의 code. 여러 개면 regionCodes=11440&regionCodes=11410처럼 반복해 보내고, 그중 하나에 맞으면 온다.
          활동과 함께 보내면 둘 다 맞는 일정만 온다. 생략하면 모든 지역이다. 모르는 코드만 보내면 빈 결과다.
          빈 값으로 보내지 않는다(맞는 일정이 없어 빈 결과가 된다). 중복을 빼고 최대 20개. 넘으면 400 INVALID_REQUEST
        required: false
        schema:
          type: array
          items:
            type: string
        example: 11440
      - name: startDate
        in: query
        description: |-
          시작 날짜 범위의 첫날. yyyy-MM-dd(한국 날짜). 그날 00:00부터 포함한다.
          endDate 없이 보내면 그날 하루다. 생략하면(endDate도 없으면) 날짜 제한이 없다. 지난 날짜도 오류가 아니다(빈 결과)
        required: false
        schema:
          type: string
          format: date
        example: 2026-11-14
      - name: endDate
        in: query
        description: |-
          시작 날짜 범위의 마지막 날. yyyy-MM-dd(한국 날짜). 그날 23:59까지 포함한다.
          startDate 없이 보내면 그날 하루다. startDate와 같으면 그날 하루, startDate보다 앞서면 400 INVALID_DATE_FILTER
        required: false
        schema:
          type: string
          format: date
        example: 2026-11-15
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor를 그대로 보낸다. 생략하면 첫 페이지다. 해석할 수 없으면 400 INVALID_CURSOR
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 개수. 생략하면 20, 50보다 크면 50, 1보다 작으면 1로 맞춘다"
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 일정 카드 한 페이지. nextCursor가 null이면 마지막 페이지다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
        "400":
          description: |-
            INVALID_REQUEST: categoryIds가 UUID 형식이 아니거나, categoryIds·regionCodes가 중복을 빼고 20개를 넘거나, 날짜가 yyyy-MM-dd 형식이 아니거나 없는 날짜이거나, size가 숫자가 아니다. 정상 화면 흐름에서는 나지 않는다.
            INVALID_DATE_FILTER: endDate가 startDate보다 앞선다. 날짜를 다시 고르게 한다.
            INVALID_CURSOR: 해석할 수 없는 cursor. cursor 없이 처음부터 다시 부른다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
      security: []
    post:
      tags:
      - 일정
      summary: 일정 개설
      description: |-
        일정을 연다. 일정 개설 화면의 [일정 열기]에서 부른다. 로그인이 필요하다.
        개설자는 확정 참여자 1명으로 함께 들어가고, 일정은 모집 중 상태로 시작한다.
        장소는 placeId만 보낸다. 서버가 장소의 이름·주소·좌표를 읽어 개설 시점 값으로 일정에 저장한다.
        두 번 눌려 같은 요청이 두 번 와도 일정은 하나만 생긴다. 두 번째 요청은 409 SCHEDULE_TIME_CONFLICT다.
        그래도 첫 응답을 받기 전까지 버튼을 막는다.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
        required: true
      responses:
        "201":
          description: 개설 완료. data.scheduleId가 만든 일정의 ID다. 내가 연 일정 목록(LIST-05)으로 이동하고
            개설 완료 팝업을 띄운다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
        "400":
          description: |-
            INVALID_REQUEST: 필수값 누락, 활동명·설명 길이 위반(errors에 필드별 문구), 없는 durationType 값.
            INVALID_CATEGORY: 없거나 숨긴 활동. 활동 목록을 다시 불러 고르게 한다.
            INVALID_PLACE: 없거나 노출이 끝난 장소, 활동과 유형이 다른 장소. 장소를 다시 고르게 한다.
            INVALID_START_AT: 30분 단위가 아니거나 지금 + 1시간보다 이르거나 오늘 + 30일보다 늦은 시작 일시. 시작 일시를 다시 고르게 한다.
            INVALID_CAPACITY: 개설자 포함 4~24명 밖의 인원.
            INVALID_TITLE·INVALID_DESCRIPTION: 서버의 안전망. 요청 검증을 통과한 값이면 나지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
        "401":
          description: |-
            UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다.
            USER_NOT_ACTIVE: 탈퇴한 사용자. 로그인 화면으로 간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
        "409":
          description: |-
            SCHEDULE_TIME_CONFLICT: 내가 개설했거나 참여 확정한 예정 일정과 시작 시각이 12시간 미만으로 떨어진다.
            정확히 12시간 차이는 허용한다. 시작 일시를 바꾸게 안내한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreateScheduleResponse"
  /api/v1/schedules/{scheduleId}/participants:
    get:
      tags:
      - 일정
      summary: 참여자 명단
      description: |-
        일정의 확정 참여자(개설자 포함) 명단을 준다. 일정 상세 화면에서 참여자 명단을 펼칠 때 부른다. 로그인이 필요하다.
        개설자와 확정 참여자만 볼 수 있다. 상세의 viewerRole이 HOST·PARTICIPANT일 때만 명단을 펼치게 하고, 그 밖(GUEST·NON_PARTICIPANT)은 부르지 않는다.
        일정이 취소·완료·모집 마감이어도 개설자와 확정 참여자는 볼 수 있다.
        data는 항목 배열이고 페이지가 없다(정원 안이라 최대 24명). 개설자가 항상 맨 앞이라 빈 배열은 오지 않는다.
        정렬은 개설자 먼저, 그 뒤 참여 일시가 이른 순(같으면 참여 기록 순)이다. 참여를 취소한 사람은 오지 않고,
        취소 후 다시 참여한 사람은 다시 참여한 시각 자리에 한 번만 온다.
        탈퇴한 사람은 닉네임 "탈퇴한 사용자", 기본 이미지, ageGroup null, withdrawn = true로 온다.
        여러 조건에 걸리면 SCHEDULE_NOT_FOUND → PARTICIPANT_LIST_FORBIDDEN 순서로 앞의 것이 온다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: listParticipants
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 참여자 명단. 개설자가 맨 앞이고 그 뒤 참여 일시 순이다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListScheduleParticipant"
        "400":
          description: "INVALID_REQUEST: scheduleId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지\
            \ 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListScheduleParticipant"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListScheduleParticipant"
        "403":
          description: |-
            PARTICIPANT_LIST_FORBIDDEN: 개설자도 확정 참여자도 아니다(참여한 적 없음, 참여를 취소함 포함).
            정상 흐름에서는 상세의 viewerRole로 막으므로 나지 않는다. 났으면(그 사이 참여를 취소한 경우 등) 상세를 다시 불러 그린다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListScheduleParticipant"
        "404":
          description: |-
            SCHEDULE_NOT_FOUND: 없거나 삭제된 일정. "찾을 수 없는 일정이에요." 토스트를 보여주고 목록 화면으로 간다.
            없는 경로의 404(INVALID_REQUEST)와는 code로 구분한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListScheduleParticipant"
    post:
      tags:
      - 일정
      summary: 참여
      description: |-
        일정에 멤버로 참여한다. 일정 상세 화면의 [참여하기]에서 부른다. 로그인이 필요하다. 요청 본문은 없다.
        성공하면 200이고 data는 없다. 성공이든 실패든 일정 상세(GET /api/v1/schedules/{scheduleId})를 다시 불러 화면을 그린다.
        마지막 자리가 차면 일정은 모집 마감이 된다. 마지막 자리에 동시에 둘이 들어오면 한 명만 성공하고 다른 한 명은 409 RECRUIT_CLOSED다.
        참여를 취소한 뒤 다시 참여할 수 있다.
        두 번 눌려 같은 요청이 두 번 와도 참여는 한 번이다. 두 번째 요청은 409 ALREADY_JOINED이고, 상태는 한 번 참여한 것과 같다.
        여러 조건에 걸리면 USER_NOT_ACTIVE → SCHEDULE_NOT_FOUND → HOST_CANNOT_JOIN → ALREADY_JOINED → RECRUIT_CLOSED → SCHEDULE_TIME_CONFLICT 순서로 앞의 것이 온다.
      operationId: join
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 참여 완료. data는 없다. 일정 상세를 다시 불러 그린다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: scheduleId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지\
            \ 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: |-
            UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다.
            USER_NOT_ACTIVE: 탈퇴한 사용자. 로그인 화면으로 간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: |-
            SCHEDULE_NOT_FOUND: 없거나 삭제된 일정. "찾을 수 없는 일정이에요"를 보여주고 이전 화면으로 간다.
            없는 경로의 404(INVALID_REQUEST)와는 code로 구분한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: |-
            HOST_CANNOT_JOIN: 내가 연 일정이다. 상세를 다시 불러 그린다.
            ALREADY_JOINED: 이미 참여 확정한 일정이다(두 번 눌렸을 때 포함). 상세를 다시 불러 그린다.
            RECRUIT_CLOSED: 모집이 끝났다. 정원이 찼거나, 시작 시각이 됐거나, 취소·완료된 일정이다. 상세를 다시 불러 그린다.
            SCHEDULE_TIME_CONFLICT: 내가 개설했거나 참여 확정한 예정 일정과 시작 시각이 12시간 미만으로 떨어진다. 정확히 12시간 차이는 허용한다. message를 보여준다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/auth/tokens:
    post:
      tags:
      - 인증
      summary: access token 재발급
      description: |-
        refreshToken 쿠키로 새 access token을 발급한다. credentials를 포함해 호출한다.
        로그인한 기기마다 세션이 따로 있다. 발급하면 같은 기기의 이전 refresh token은 무효가 되므로 동시에 여러 번 호출하지 않는다.
        다른 기기의 세션에는 영향이 없다.
        401 INVALID_REFRESH_TOKEN이면 로그인 화면으로 보낸다.
      operationId: reissue
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
      security: []
    delete:
      tags:
      - 인증
      summary: 로그아웃
      description: |-
        refreshToken 쿠키가 가리키는 이 기기의 세션만 끝내고 쿠키를 만료시킨다. 다른 기기의 로그인은 유지된다.
        쿠키를 읽으므로 credentials를 포함해 호출한다.
        쿠키가 없거나 이미 끝난 세션이어도 200이다. 다시 호출해도 안전하다.
        이미 발급된 access token은 만료까지 유효하므로 클라이언트에서 버린다.
      operationId: logout
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/v1/auth/signup:
    post:
      tags:
      - 인증
      summary: 가입 완료
      description: |-
        프로필을 받아 가입을 마치고 access token을 돌려준다. signUpToken 쿠키가 필요하므로 credentials를 포함해 호출한다.
        소셜 정보는 서버가 보관한 가입 세션에서 꺼낸다. 가입이 끝나면 signUpToken은 무효가 된다.
        필드 형식이 틀리면 400 INVALID_REQUEST와 함께 errors에 틀린 필드와 문구가 담긴다.
        가입일 기준 만 18세 미만이면 400 UNDERAGE, 닉네임이 이미 쓰이고 있으면(대소문자 무시) 409 DUPLICATED_NICKNAME이다.
      operationId: signUp
      parameters:
      - name: signUpToken
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
      security: []
  /api/v1/auth/signup/profile-image:
    post:
      tags:
      - 인증
      summary: 프로필 사진 업로드
      description: |-
        가입 중에 프로필 사진을 바꿀 때 쓴다. 돌려받은 경로를 가입 요청의 profileImageUrl에 넣는다.
        5MB 이하의 JPG·PNG만 받는다. 형식은 파일 내용으로 판별하므로 확장자를 바꿔 올려도 거부된다.
      operationId: uploadProfileImage_1
      parameters:
      - name: signUpToken
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProfileImageResponse"
      security: []
  /api/v1/users/me:
    get:
      tags:
      - 사용자
      summary: 내 프로필 조회
      description: |-
        로그인한 사용자의 프로필을 돌려준다. 내 정보 화면(MY-01)에 들어갈 때와 프로필 수정 화면(MY-02)을 열 때 부른다.
        email은 등록하지 않았으면 빈 문자열이다(null이 아니다).
        ageGroup은 오늘(한국 시간) 기준 만 나이로 계산한다. decade는 십의 자리 × 10이고,
        phase는 EARLY 초반(일의 자리 0~3), MID 중반(4~6), LATE 후반(7~9)이다. 만 18·19세는 10대 후반(10, LATE)이다.
        nicknameChangeableAt은 닉네임을 다시 바꿀 수 있는 시각이다. null이면 지금 바꿀 수 있다(바꾼 적이 없을 때 포함).
        값이 있으면 프로필 수정 화면에서 닉네임 칸을 막고 그 날짜를 안내한다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: getMyProfile
      responses:
        "200":
          description: 내 프로필
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
        "404":
          description: "USER_NOT_FOUND: 토큰의 사용자가 없거나 탈퇴했다. 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
    delete:
      tags:
      - 사용자
      summary: 탈퇴
      description: |-
        사용자를 탈퇴시킨다. 회원 탈퇴 화면(MY-04)의 재확인 팝업에서 확인을 누르면 부른다.
        먼저 탈퇴 가능 여부 API와 같은 기준으로 남은 일정을 확인하고, 탈퇴를 막는 일정이 있으면 409 WITHDRAWAL_BLOCKED로 아무것도 바꾸지 않는다.
        계정은 삭제 표시되고, 이름·이메일·닉네임·생년월일·프로필 사진 원본은 90일 보관한 뒤 비식별한다.
        탈퇴한 닉네임은 90일 동안 다른 사람이 쓸 수 없다.
        카카오 연결도 끊어지므로 다시 로그인하면 동의 화면부터 시작한다.
        되돌릴 수 없고, 다시 가입하면 이전 활동과 이어지지 않는 새 계정이 된다.
        모든 기기의 refresh token이 무효가 되고, 성공 응답이 refreshToken 쿠키를 만료시킨다(Set-Cookie, Max-Age=0).
        브라우저가 쿠키 만료를 적용하도록 credentials를 포함해 호출한다. 이미 발급된 access token은 클라이언트에서 버리고 로그인 전 화면으로 보낸다.
        두 번 눌려 다시 보내면 두 번째 요청은 이미 탈퇴한 사용자라 404 USER_NOT_FOUND다. 탈퇴는 끝난 것이므로 성공과 같이 처리한다.
      operationId: withdraw
      responses:
        "200":
          description: 탈퇴 완료. refreshToken 쿠키를 만료시키는 Set-Cookie가 함께 나간다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: "USER_NOT_FOUND: 토큰의 사용자가 없거나 이미 탈퇴했고, 탈퇴를 막는 일정은 없다. 탈퇴가 끝\
            난 것으로 보고 토큰을 버린 뒤 로그인 전 화면으로 보낸다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: |-
            WITHDRAWAL_BLOCKED: 확정 참여했거나 개설한 일정 중 취소되지 않았고 시작 후 24시간이 지나지 않은 것이 있다. 쿠키는 그대로다.
            message(모든 일정 취소 혹은 진행 중 이후 24시간이 지나야 탈퇴할 수 있어요.)를 보여주고,
            탈퇴 가능해지는 시각은 탈퇴 가능 여부 API의 availableAt으로 다시 받아 안내한다.
            남은 일정 확인이 사용자 확인보다 먼저라, 카카오 연결 끊기로 이미 탈퇴됐고 막는 일정이 남은 사용자가 남은 access token으로 부르면 404가 아니라 이 코드다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
    patch:
      tags:
      - 사용자
      summary: 내 프로필 수정
      description: |-
        닉네임·이메일·프로필 사진을 바꾼다. 프로필 수정 화면(MY-02)의 [저장]에서 부른다. 응답은 내 프로필 조회와 같은 형태다.
        바꿀 필드만 보낸다. 생략한 필드는 그대로 둔다. 현재 값과 정확히 같은 값은 바꾸지 않은 것으로 본다(닉네임 변경 제한에도 세지 않는다).
        이메일을 빈 문자열("")로 보내면 이메일을 지운다.
        프로필 사진은 프로필 사진 업로드 API(POST /api/v1/users/me/profile-image)가 돌려준 경로만 받는다. 사진을 바꾸면 이전에 올렸던 사진 파일은 지워진다.
        이름·성별·생년월일은 바꿀 수 없다. 요청에 넣어도 무시한다. 화면에서는 읽기 전용으로 보여준다.
        닉네임은 14일에 한 번만 바꿀 수 있다. 마지막 변경 후 14일 안에 다른 닉네임을 보내면 409 NICKNAME_CHANGE_RESTRICTED다.
        가입 후 첫 변경은 제한이 없다. 다시 바꿀 수 있는 시각은 응답과 내 프로필 조회의 nicknameChangeableAt으로 알 수 있다.
        바꾸기 전 닉네임은 14일 동안 다른 사람이 쓰지 못한다.
        검사 순서는 형식 → 닉네임 변경 제한 → 닉네임 중복이다. 하나라도 실패하면 아무것도 저장하지 않는다.
        같은 요청을 다시 보내도 된다. 두 번째 요청은 바뀐 것이 없어 그대로 성공한다.
      operationId: updateMyProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileRequest"
        required: true
      responses:
        "200":
          description: 수정 완료. data는 바뀐 뒤의 내 프로필이다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
        "400":
          description: |-
            INVALID_REQUEST: 닉네임·이메일 형식 위반. errors에 필드(nickname, email)별 문구가 담긴다. 해당 칸 아래에 문구를 보여준다.
            INVALID_PROFILE_IMAGE_URL: 업로드 API가 준 경로가 아니거나(빈 문자열·형식이 바뀐 경로 포함) 다른 회원이 쓰고 있는 경로다. 사진을 다시 올리게 한다.
            INVALID_NICKNAME·INVALID_EMAIL: 서버의 안전망. 요청 검증을 통과한 값이면 나지 않는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
        "404":
          description: "USER_NOT_FOUND: 토큰의 사용자가 없거나 탈퇴했다. 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
        "409":
          description: |-
            DUPLICATED_NICKNAME: 다른 회원이 쓰고 있거나 보호 기간이 남은 닉네임이다(대소문자 무시). 다른 닉네임을 입력하게 한다.
            NICKNAME_CHANGE_RESTRICTED: 마지막 닉네임 변경 후 14일이 지나지 않았다. 내 프로필 조회의 nicknameChangeableAt으로 바꿀 수 있는 날짜를 안내한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyProfileResponse"
  /api/v1/users/nickname-availability:
    get:
      tags:
      - 사용자
      summary: 닉네임 사용 가능 여부
      description: |-
        입력한 닉네임을 쓸 수 있는지 알려준다. 가입 닉네임 입력 화면과 프로필 수정 화면에서 닉네임 칸을 벗어날 때 부른다.
        결과는 안내용이다. 가입·프로필 수정 API가 저장할 때 같은 검사를 다시 하므로, 여기서 true였어도 그 사이 다른 사람이 쓰면 가입·수정이 DUPLICATED_NICKNAME으로 실패할 수 있다.
        토큰은 선택이다. 가입 중에는 토큰 없이 부른다. 토큰이 있으면 본인의 현재 닉네임은 사용 가능(true)으로 본다(대소문자 무시).
        토큰이 틀리거나 만료돼도 401이 아니라 익명으로 처리한다. 이때는 본인 닉네임도 사용 중으로 나온다.
        판정 순서: 형식(2~10자의 한글·영문·숫자·.·_)이 틀리면 INVALID_FORMAT, 본인의 현재 닉네임이면 true,
        다른 회원이 쓰고 있거나 보호 기간(변경 전 14일, 탈퇴 90일)이 남았으면 DUPLICATED. 대소문자는 무시한다.
        DUPLICATED는 사용 중과 보호 중을 구분하지 않는다. 보호 중임을 알리면 다른 회원의 탈퇴·변경 여부가 드러나기 때문이다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: checkNicknameAvailability
      parameters:
      - name: nickname
        in: query
        description: 확인할 닉네임. 2~10자의 한글·영문·숫자·.·_
        required: true
        schema:
          type: string
        example: 민트초코
      responses:
        "200":
          description: 판정 결과. 형식 오류·중복도 200이고 data.available과 data.reason으로 알려준다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNicknameAvailabilityResponse"
        "400":
          description: "INVALID_REQUEST: nickname 파라미터가 없다. 빈 값(?nickname=)은 400이\
            \ 아니라 200 INVALID_FORMAT이다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNicknameAvailabilityResponse"
  /api/v1/users/me/withdrawal-eligibility:
    get:
      tags:
      - 사용자
      summary: 탈퇴 가능 여부
      description: |-
        지금 탈퇴할 수 있는지와 탈퇴할 수 있게 되는 시각을 알려준다. 회원 탈퇴 화면(MY-04)에서 [회원 탈퇴]를 누르면 부른다.
        withdrawable이 true면 재확인 팝업을 띄우고, 사용자가 확인하면 탈퇴 API(DELETE /api/v1/users/me)를 부른다.
        false면 탈퇴 불가 팝업에 availableAt(그 시각 이후 탈퇴 가능)을 안내한다.
        탈퇴를 막는 일정: 내가 확정 참여했거나 개설한 일정 중 취소되지 않았고(예정·완료 모두) 시작 후 24시간이 지나지 않은 것.
        취소된 일정과 참여를 취소한 일정은 막지 않는다. 시작 + 24시간이 정확히 지금이면 막지 않는다.
        availableAt은 막는 일정 중 시작 시각이 가장 늦은 일정의 시작 + 24시간이다. 한국 시간 ISO-8601(오프셋 없음). 탈퇴할 수 있으면 null이다.
        결과는 안내용이다. 이 응답 뒤에 일정에 참여하면 탈퇴 API가 409 WITHDRAWAL_BLOCKED로 막을 수 있다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: checkWithdrawal
      responses:
        "200":
          description: 판정 결과. 탈퇴할 수 없어도 200이고 data.withdrawable=false로 알려준다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWithdrawalEligibilityResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWithdrawalEligibilityResponse"
  /api/v1/schedules/{scheduleId}:
    get:
      tags:
      - 일정
      summary: 일정 상세
      description: |-
        일정 하나의 내용과 보는 사람이 누를 수 있는 버튼을 준다. 일정 상세 화면(DTL)에 들어올 때,
        그리고 참여·참여 취소·일정 취소를 부른 뒤(성공이든 실패든) 다시 불러 화면을 그린다.
        토큰은 선택이다. 토큰 없이 부르면 viewerRole = GUEST이고, 토큰이 있으면 그 사용자의 역할(HOST·PARTICIPANT·NON_PARTICIPANT)과
        그에 맞는 availableActions가 온다. 틀리거나 만료된 토큰은 401이 아니라 토큰이 없는 것(GUEST)으로 처리한다.
        버튼은 availableActions에 든 동작만 활성으로 그린다. 비활성 버튼의 문구(모집 마감·완료·취소됨 등)는 displayStatus를 보고 FE가 정한다.
        시작 시각이 지났는데 아직 모집 중으로 저장된 일정(상태 전환 전)도 displayStatus = RECRUITMENT_CLOSED로 온다.
        장소는 개설 시점의 값이다. 일정 취소 사유는 아직 응답에 없다(일정 전체 취소 API와 함께 생긴다).
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: getDetail
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 일정 상세. availableActions의 버튼만 활성으로 그린다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleDetailResponse"
        "400":
          description: "INVALID_REQUEST: scheduleId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지\
            \ 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleDetailResponse"
        "404":
          description: |-
            SCHEDULE_NOT_FOUND: 없거나 삭제된 일정. "찾을 수 없는 일정이에요." 토스트를 보여주고 목록 화면으로 간다.
            없는 경로의 404(INVALID_REQUEST)와는 code로 구분한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleDetailResponse"
  /api/v1/schedules/participating:
    get:
      tags:
      - 일정
      summary: 참여한 일정 목록
      description: |-
        내가 멤버로 참여한 일정을 카드로 보여준다. 목록 화면의 참여한 일정 탭에서 부른다. 로그인이 필요하다.
        완료 전(시작 + 12시간 전) 일정만 온다. 시작한 일정도 완료 전이면 온다.
        개설자가 취소한 일정도 완료 시각 전까지 displayStatus = CANCELED(일정 취소됨)로 남는다.
        내가 참여를 취소한 일정과 내가 연 일정은 오지 않는다(내가 연 일정은 개설한 일정 목록에 있다).
        정렬·페이지(cursor, size, nextCursor)는 모집 중 목록과 같다. 필터는 없다.
        없으면 items는 빈 배열이고 nextCursor는 null이다. 조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: listParticipating
      parameters:
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor를 그대로 보낸다. 생략하면 첫 페이지다. 해석할 수 없으면 400 INVALID_CURSOR
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 개수. 생략하면 20, 50보다 크면 50, 1보다 작으면 1로 맞춘다"
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 일정 카드 한 페이지. nextCursor가 null이면 마지막 페이지다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
        "400":
          description: |-
            INVALID_REQUEST: size가 숫자가 아니다. 정상 화면 흐름에서는 나지 않는다.
            INVALID_CURSOR: 해석할 수 없는 cursor. cursor 없이 처음부터 다시 부른다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
  /api/v1/schedules/hosted:
    get:
      tags:
      - 일정
      summary: 개설한 일정 목록
      description: |-
        내가 연 일정을 카드로 보여준다. 목록 화면의 개설한 일정 탭에서 부르고, 일정 개설에 성공한 뒤 이 화면(내가 연 일정)으로 와서 부른다.
        로그인이 필요하다. 완료 전(시작 + 12시간 전) 일정만 온다. 방금 연 일정도 온다.
        내가 취소한 일정도 완료 시각 전까지 displayStatus = CANCELED(일정 취소됨)로 남는다. 멤버로 참여만 한 일정은 오지 않는다.
        정렬·페이지(cursor, size, nextCursor)는 모집 중 목록과 같다. 필터는 없다.
        없으면 items는 빈 배열이고 nextCursor는 null이다. 조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: listHosted
      parameters:
      - name: cursor
        in: query
        description: 이전 응답의 nextCursor를 그대로 보낸다. 생략하면 첫 페이지다. 해석할 수 없으면 400 INVALID_CURSOR
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 페이지 개수. 생략하면 20, 50보다 크면 50, 1보다 작으면 1로 맞춘다"
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: 일정 카드 한 페이지. nextCursor가 null이면 마지막 페이지다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
        "400":
          description: |-
            INVALID_REQUEST: size가 숫자가 아니다. 정상 화면 흐름에서는 나지 않는다.
            INVALID_CURSOR: 해석할 수 없는 cursor. cursor 없이 처음부터 다시 부른다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleCardPageResponse"
  /api/v1/regions:
    get:
      tags:
      - 지역
      summary: 지역 목록
      description: |-
        서비스 중인 지역 목록. 일정 목록의 지역 필터와 장소 선택의 지역 칩을 그릴 때 부른다.
        토큰 없이 부를 수 있다. 서비스하지 않는(비활성) 지역은 빠지고, 서버가 정한 노출 순서(display_order)대로 온다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: findRegions
      responses:
        "200":
          description: 노출 순서대로 정렬된 지역 목록
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListRegionResponse"
      security: []
  /api/v1/place-candidates:
    get:
      tags:
      - 장소 후보
      summary: 장소 후보
      description: |-
        활동이 고를 수 있는 유형의 장소 목록(보드게임 → 보드게임카페, 방탈출 → 방탈출 매장, 산책 → 공원).
        장소 선택 화면에 들어올 때와 지역 칩을 바꿀 때 부른다. 목록과 지도 핀을 이 결과로 그리고, 고른 장소의 id를 일정 개설의 placeId로 보낸다.
        토큰 없이 부를 수 있다. 검수를 통과하고 영업 중인, 서비스 중인 지역의 장소만 온다.
        정렬은 지역 노출 순서(display_order), 그 안에서 장소명 순이다. 페이지를 나누지 않는다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: listPlaceCandidates
      parameters:
      - name: categoryId
        in: query
        description: 활동 ID. 활동 목록 API의 id
        required: true
        schema:
          type: string
          format: uuid
        example: 01a19cc6-3d80-7000-8000-000000000001
      - name: regionCode
        in: query
        description: 지역 코드. 지역 목록 API의 code. 생략하면 서비스 중인 지역 전체다. 빈 값으로 보내지 않는다
        required: false
        schema:
          type: string
        example: 11440
      responses:
        "200":
          description: 정렬된 장소 후보 목록. 조건에 맞는 장소가 없으면 빈 배열이고 화면에 결과 없음을 보여준다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPlaceCandidateResponse"
        "400":
          description: |-
            INVALID_REQUEST: categoryId가 없거나 UUID 형식이 아니다.
            INVALID_CATEGORY: 없거나 숨긴 활동. 활동 목록을 다시 불러 고르게 한다. 지역도 틀렸어도 이 코드가 온다.
            INVALID_REGION: 없거나 서비스하지 않는 지역, 빈 값으로 보낸 regionCode. 지역 목록을 다시 불러 고르게 한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListPlaceCandidateResponse"
      security: []
  /api/v1/auth/{provider}/callback:
    get:
      tags:
      - 인증
      summary: 소셜 인증 콜백
      description: |-
        소셜이 호출하는 주소다. 클라이언트가 직접 부르지 않는다.
        기존 회원이면 refreshToken 쿠키를, 신규면 signUpToken 쿠키를 심고 프론트엔드로 302 리다이렉트한다.
        신규는 쿼리로 signUp=true가 붙는다. 토큰은 URL에 담지 않는다.
      operationId: callback
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - KAKAO
          - NAVER
          - APPLE
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        "302":
          description: 프론트엔드로 이동. 쿠키가 심어진다
      security: []
  /api/v1/auth/{provider}/authorize:
    get:
      tags:
      - 인증
      summary: 소셜 로그인 시작
      description: |-
        소셜 인증 페이지로 302 리다이렉트한다. 클라이언트는 소셜 앱 키를 갖지 않는다.
        **fetch나 XHR로 부르지 않는다.** 브라우저를 이동시켜야 한다(window.location.href = ...).
        fetch는 리다이렉트를 따라가 소셜 도메인에 닿고, 소셜은 CORS 헤더를 주지 않아 실패한다.
        같은 이유로 Swagger의 Try it out에서도 실패한다. 주소창에 직접 입력해 시험한다.
      operationId: authorize
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - KAKAO
          - NAVER
          - APPLE
      responses:
        "302":
          description: 소셜 인증 페이지로 이동. Location 헤더에 주소가 담긴다
      security: []
  /api/v1/auth/signup/session:
    get:
      tags:
      - 인증
      summary: 가입 세션 조회
      description: |-
        프로필 완성 화면의 기본값(소셜 닉네임·사진)을 돌려준다. signUpToken 쿠키가 필요하므로 credentials를 포함해 호출한다.
        세션이 만료되면 401 INVALID_SIGNUP_TOKEN이 오고, 소셜 로그인부터 다시 해야 한다.
      operationId: signUpSession
      parameters:
      - name: signUpToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSignUpSessionResponse"
      security: []
  /api/v1/activity-categories:
    get:
      tags:
      - 활동
      summary: 활동 목록
      description: |-
        고를 수 있는 활동(보드게임·방탈출·산책 등) 목록. 일정 개설의 활동 선택과 일정 목록의 활동 필터를 그릴 때 부른다.
        토큰 없이 부를 수 있다. 숨긴(비활성) 활동은 빠지고, 서버가 정한 노출 순서(display_order)대로 온다.
        조회만 하므로 같은 요청을 몇 번 다시 보내도 된다.
      operationId: findActivityCategories
      responses:
        "200":
          description: 노출 순서대로 정렬된 활동 목록
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListActivityCategoryResponse"
      security: []
  /api/v1/schedules/{scheduleId}/participants/me:
    delete:
      tags:
      - 일정
      summary: 참여 취소
      description: |-
        내 참여를 취소한다. 참여 취소 확인 팝업의 [확인]에서 부른다. 로그인이 필요하다. 요청 본문은 없다.
        성공하면 200이고 data는 없다. 성공이든 실패든 일정 상세(GET /api/v1/schedules/{scheduleId})를 다시 불러 화면을 그린다.
        시작 후에도 완료(시작 + 12시간) 전까지 취소할 수 있다. 시작 전에 취소해 자리가 나면 마감된 모집이 다시 열리고,
        시작 후 취소로 자리가 나도 모집은 다시 열리지 않는다. 취소한 뒤 다시 참여할 수 있다.
        두 번 눌려 같은 요청이 두 번 와도 취소는 한 번이다. 두 번째 요청은 409 NOT_PARTICIPANT이고, 재시도해도 안전하다.
        여러 조건에 걸리면 SCHEDULE_NOT_FOUND → HOST_CANNOT_LEAVE → NOT_PARTICIPANT → PARTICIPATION_NOT_CANCELABLE 순서로 앞의 것이 온다.
      operationId: leave
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 참여 취소 완료. data는 없다. 일정 상세를 다시 불러 그린다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "400":
          description: "INVALID_REQUEST: scheduleId가 UUID 형식이 아니다. 정상 화면 흐름에서는 나지\
            \ 않는다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "401":
          description: "UNAUTHENTICATED: 토큰이 없거나 만료·무효. 재발급 후 다시 부르거나 로그인 화면으로 간다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "404":
          description: |-
            SCHEDULE_NOT_FOUND: 없거나 삭제된 일정. "찾을 수 없는 일정이에요"를 보여주고 이전 화면으로 간다.
            없는 경로의 404(INVALID_REQUEST)와는 code로 구분한다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
        "409":
          description: |-
            HOST_CANNOT_LEAVE: 내가 연 일정이다. 개설자는 참여를 취소할 수 없다. 상세를 다시 불러 그린다.
            NOT_PARTICIPANT: 참여 확정 상태가 아니다(참여한 적 없음, 이미 취소함 포함). 재시도해도 안전하다. 상세를 다시 불러 그린다.
            PARTICIPATION_NOT_CANCELABLE: 취소됐거나 완료된(시작 + 12시간이 지난) 일정이다. 상세를 다시 불러 그린다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    ApiResponseProfileImageResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/ProfileImageResponse"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ProfileImageResponse:
      type: object
      properties:
        profileImageUrl:
          type: string
          description: 저장된 사진 경로. 프로필 수정 요청(PATCH /api/v1/users/me)의 profileImageUrl에
            그대로 넣는다
          example: /images/profiles/0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9.png
    CreateScheduleRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: 활동 ID. 활동 목록 API(GET /api/v1/activity-categories) 응답의 id
          example: 01a19cc6-3d80-7000-8000-000000000001
        placeId:
          type: string
          format: uuid
          description: 장소 ID. 장소 후보 API 응답의 id. 장소는 활동이 고를 수 있는 유형이어야 한다. 장소명·주소·좌표는
            보내지 않는다(서버가 장소에서 읽어 저장한다)
          example: 01a1a2b3-0000-7000-8000-000000000001
        title:
          type: string
          description: 활동명. 앞뒤 공백을 뺀 길이로 1~20자. 저장되는 값은 앞뒤 공백을 뺀 값이다
          example: 보드게임 같이 해요
          pattern: "^\\s*\\S(?:[\\s\\S]{0,18}\\S)?\\s*$"
        durationType:
          type: string
          description: "예상 소요 시간. SHORT 1시간 내외(60분), NORMAL 2시간 내외(120분), LONG 3시간\
            \ 이상(180분)"
          enum:
          - SHORT
          - NORMAL
          - LONG
          example: NORMAL
        description:
          type: string
          description: 간략 설명. 앞뒤 공백을 뺀 길이로 10~500자. 줄바꿈을 쓸 수 있다. 저장되는 값은 앞뒤 공백을 뺀
            값이다
          example: 처음 오시는 분도 환영해요. 룰은 같이 배우면서 해요.
          pattern: "^\\s*\\S[\\s\\S]{8,498}\\S\\s*$"
        startAt:
          type: string
          format: date-time
          description: 시작 일시. 오프셋 없는 한국 시간. 분은 00 또는 30이고 초는 0. 지금 + 1시간 이후(같으면 허용)이고
            시작 날짜가 오늘 + 30일 이내
          example: 2026-11-07T19:30:00
        capacity:
          type: integer
          format: int32
          description: 인원. 개설자를 포함한 전체 인원으로 4~24
          example: 6
      required:
      - capacity
      - categoryId
      - description
      - durationType
      - placeId
      - startAt
      - title
    ApiResponseCreateScheduleResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/CreateScheduleResponse"
        errors:
          type: array
